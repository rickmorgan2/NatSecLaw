project:
  type: website
  # GitHub Pages serves the site from the docs/ folder
  output-dir: docs
  # regenerate statute pages and manifest CSVs from data/ before each render
  pre-render: R/build_pages.R
  render:
    - "*.qmd"
    - "statutes/*.qmd"
  resources:
    - "data/*.csv"
    - ".nojekyll"

website:
  title: "U.S. National Security Legislation"
  description: "A wiki and knowledge graph of key U.S. national security and foreign policy statutes."
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: "Statutes"
        href: index.qmd
      - text: "Knowledge graph"
        href: graph.qmd
      - text: "Title 10 and Title 50"
        href: title10-title50.qmd
      - text: "Member lens"
        href: member.qmd
      - text: "Manifest"
        href: manifest.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    left: "Independent reference project. Not affiliated with any congressional office. Not legal advice; check citations against the linked primary sources."
    right: "Content last reviewed November 10, 2026"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    smooth-scroll: true
    # no MathJax download, so the site works offline
    html-math-method: plain

execute:
  echo: false
  warning: false
  message: false
