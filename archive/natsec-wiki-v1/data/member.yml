# The member this copy of the wiki is tailored to, identified by district only.
# The site is public, so the member's name is deliberately left out of all text and labels.
# member.qmd is built entirely from this file, so swapping it retargets the lens.
name: U.S. Representative for Colorado's 6th District (CO-06)
short: CO-06
seat: Colorado's 6th Congressional District
party: Democrat
as_of: "2026-11-10"
background: >-
  Former Army Ranger and paratrooper with three combat tours in Iraq and
  Afghanistan. First elected in 2018 and reelected to a fifth term on November 3,
  2026. In the 119th Congress he serves on the House Armed Services Committee and
  the House Permanent Select Committee on Intelligence. Committee assignments for
  the 120th Congress had not been announced when this page was last reviewed.
profile_sources:
  - label: "CO-06 House office, Committees and Caucuses"
    url: "https://crow.house.gov/about/committees-and-caucuses"
  - label: "CO-06 House office, About"
    url: "https://crow.house.gov/about"
  - label: "Colorado Public Radio, 6th District election result (Nov. 3, 2026)"
    url: "https://www.cpr.org/2026/11/03/colorado-election-results-congressional-district-6-crow-clark/"

committees:
  - id: hasc
    name: House Armed Services Committee
    short: Armed Services
    role: Member. Ranking Member of the Subcommittee on Intelligence and Special Operations.
    jurisdiction: >-
      The Defense Department and the armed forces, which in code terms means
      Title 10 and the annual defense authorization. The subcommittee covers
      special operations forces, defense intelligence, counterterrorism, and
      related science and technology programs.
    code_titles: [10, 32]
    statutes: [ndaa-annual, title10-usc, goldwater-nichols-1986, nunn-cohen-1986,
               sec127e-2004, sec394-cyber-2018, seccoop-2016, leahy-laws,
               reserve-mobilization, ucmj-1950, dpa-1950, wpr-1973, aumf-2001]
    source:
      label: "New America, member profile (committee roles)"
      url: "https://www.newamerica.org/people/rep-jason-crow/"
  - id: hpsci
    name: House Permanent Select Committee on Intelligence
    short: Intelligence
    role: Member. Reported subcommittees are Central Intelligence Agency and Open Source Intelligence.
    jurisdiction: >-
      The intelligence community and the annual intelligence authorization,
      which in code terms means the intelligence chapters of Title 50. The
      committee receives covert action findings and oversees surveillance
      authorities.
    code_titles: [50]
    statutes: [title50-usc, nsa-1947, cia-act-1949, intel-oversight-1980,
               fisa-1978, fisa-amendments-2008, risaa-2024, irtpa-2004,
               sec394-cyber-2018, cisa-2015]
    source:
      label: "CO-06 House office, appointment to the Intelligence Committee (Jan. 22, 2025)"
      url: "https://crow.house.gov/media/press-releases/congressman-crow-appointed-to-the-house-permanent-select-committee-on-intelligence"

initiatives:
  - id: venezuela-wpr-2026
    title: War Powers Resolution on Venezuela
    short: Venezuela WPR
    date: "2026-01-08"
    kind: Resolution introduced
    summary: >-
      Introduced a war powers resolution concerning U.S. military action in
      Venezuela, joined by six other House members. The outcome is not recorded
      here.
    statutes: [wpr-1973, constitution-war-powers]
    source:
      label: "CO-06 House office, press release (Jan. 8, 2026)"
      url: "https://crow.house.gov/media/press-releases/crow-introduces-war-powers-resolution-to-rein-in-trump-military-action-in-venezuela"
  - id: iran-wpr-2026
    title: War Powers Resolution on Iran
    short: Iran WPR
    date: "2026-05-01"
    kind: Resolution introduced
    summary: >-
      Introduced a war powers resolution concerning U.S. military action against
      Iran. His office announced a House vote on the resolution, led with Rep.
      Pramila Jayapal, for July 22, 2026. The outcome is not recorded here.
    statutes: [wpr-1973, constitution-war-powers, declarations-of-war]
    source:
      label: "CO-06 House office, press releases (May 1 and July 22, 2026)"
      url: "https://crow.house.gov/media/press-releases"
  - id: no-funds-iran-2026
    title: No Funds for Iran War Act
    short: No Funds for Iran War Act
    date: "2026-05-06"
    kind: Bill introduced
    summary: >-
      Introduced a bill to prohibit federal funding for military action against
      Iran, using Congress's appropriations power as the check instead of the
      War Powers Resolution's procedures.
    statutes: [constitution-war-powers, wpr-1973]
    source:
      label: "CO-06 House office, press releases (May 6, 2026)"
      url: "https://crow.house.gov/media/press-releases"
  - id: afghan-adjustment
    title: Afghan Adjustment Act
    short: Afghan Adjustment Act
    date: "2026"
    kind: Bill introduced
    summary: >-
      Bipartisan bill, introduced with Rep. Mariannette Miller-Meeks, to give
      Afghans who assisted U.S. forces a path to permanent status with added
      vetting.
    statutes: [aumf-2001]
    source:
      label: "CO-06 House office, press release on the Afghan Adjustment Act"
      url: "https://crow.house.gov/media/press-releases/crow-introduces-bipartisan-legislation-to-help-afghans-who-assisted-american-servicemembers-resettle-in-us"
  - id: afghan-tps-2026
    title: Afghanistan TPS Act of 2026
    short: Afghanistan TPS Act
    date: "2026-07-23"
    kind: Bill introduced
    summary: >-
      Bipartisan bill to designate Afghanistan for Temporary Protected Status
      through July 2029. In November 2026 he was reported to be preparing a
      discharge petition to force a House vote.
    statutes: [aumf-2001]
    source:
      label: "CO-06 House office, press release (July 23, 2026)"
      url: "https://crow.house.gov/media/press-releases/crow-introduces-bill-to-grant-vulnerable-afghans-temporary-protected-status"
  - id: afghanistan-oversight-2020
    title: Afghanistan drawdown oversight bill
    short: Afghanistan oversight (2020)
    date: "2020"
    kind: Bill introduced
    summary: >-
      Bipartisan bill, introduced with Rep. Liz Cheney, requiring an interagency
      report and certification to Congress before U.S. troop levels in
      Afghanistan were reduced.
    statutes: [ndaa-annual, aumf-2001]
    source:
      label: "CO-06 House office, press release on the Afghanistan oversight bill"
      url: "https://crow.house.gov/media/press-releases/representatives-crow-and-cheney-introduce-bipartisan-afghanistan-oversight"
  - id: space-guard
    title: Space National Guard Establishment Act of 2025
    short: Space National Guard Act
    date: "2025"
    kind: Bill (role not verified)
    summary: >-
      Listed among his 119th Congress legislation. It would create a Space
      National Guard as the reserve component of the Space Force. Whether he is
      the sponsor or a cosponsor of the 2025 bill was not verified.
    statutes: [title32-usc, reserve-mobilization, title10-usc]
    source:
      label: "WTFVote, member legislative profile (unofficial tracker)"
      url: "https://wtfvote.us/profile/Jason_Crow"
  - id: lawful-orders-2025
    title: Statement on lawful orders
    short: Lawful orders statement
    date: "2025-11"
    kind: Public statement
    summary: >-
      Joined five other Democratic lawmakers in a video stating that service
      members can refuse illegal orders. President Trump sharply criticized the
      participants.
    statutes: [ucmj-1950, constitution-war-powers]
    source:
      label: "Colorado Public Radio, 6th District election result (Nov. 3, 2026)"
      url: "https://www.cpr.org/2026/11/03/colorado-election-results-congressional-district-6-crow-clark/"

equities:
  - id: buckley
    title: Buckley Space Force Base
    short: Buckley SFB
    summary: >-
      The base in Aurora hosts Space Force and Colorado Air National Guard
      units. He has cited support for Buckley as a reason for serving on Armed
      Services and convenes a Future of Buckley Task Force.
    statutes: [ndaa-annual, title10-usc, title32-usc, reserve-mobilization]
    source:
      label: "CO-06 House office, appointment to the Armed Services Committee (Jan. 2025)"
      url: "https://crow.house.gov/media/press-releases/congressman-crow-appointed-to-the-house-armed-services-committee"
  - id: aerospace
    title: Colorado aerospace and defense industry
    short: Aerospace industry
    summary: >-
      His 2026 platform included expanding Colorado's aerospace industry. The
      statutes that most affect that sector are export controls, arms export
      licensing, foreign investment review, and defense production authorities.
    statutes: [ecra-2018, aeca-1976, firrma-2018, dpa-1950]
    source:
      label: "Sentinel Colorado, 2026 midterm election coverage (Nov. 5, 2026)"
      url: "https://sentinelcolorado.com/metro/2026-midterm-election-first-results-for-aurora-the-state-and-the-nation/"
  - id: veterans
    title: Veterans and military families
    short: Veterans
    summary: >-
      A combat veteran himself, he frames much of his national security work
      around service members and veterans. Personnel policy and military justice
      reach them through the defense authorization.
    statutes: [ndaa-annual, ucmj-1950, selective-service-1948]
    source:
      label: "CO-06 House office, About"
      url: "https://crow.house.gov/about"

