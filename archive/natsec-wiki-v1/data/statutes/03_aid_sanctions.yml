- id: faa-1961
  title: Foreign Assistance Act of 1961
  short: Foreign Assistance Act
  year: 1961
  enacted: "1961-09-04"
  domain: aid-sanctions
  public_law: "87-195"
  stat: "75 Stat. 424"
  usc: "22 U.S.C. 2151 et seq."
  usc_path: "22/2151"
  status: in-force
  status_note: >-
    In force. It has not had a comprehensive reauthorization since 1985, so
    foreign aid policy is mostly set through annual appropriations acts.
  summary: >-
    The basic law of U.S. foreign aid. It separated economic from military
    assistance, set the purposes and conditions of each, and led President Kennedy
    to create the U.S. Agency for International Development by executive order two
    months later.
  provisions:
    - "Part I: development assistance, including health, education, democracy, and disaster relief authorities."
    - "Part II: security assistance, including the Economic Support Fund, military education and training, peacekeeping, and Section 506 drawdown authority."
    - "Secs. 116 and 502B: human rights conditions on economic and security assistance."
    - "Sec. 620 and following: country and conduct restrictions, including the Cuba embargo authority in Sec. 620(a)."
    - "Sec. 634A: advance notice to Congress before funds are reprogrammed."
  significance: >-
    Most later aid and security assistance law is written as an amendment or
    companion to this act: the [[leahy-laws]], the [[symington-glenn]],
    the [[hughes-ryan-1974]], the [[gfa-2019]], and the military sales side that became
    the [[aeca-1976]]. Its age and accumulated amendments are a common argument for
    rewriting it.
  tags: [foreign aid, USAID, security assistance, human rights, development]

- id: leahy-laws
  title: Leahy Laws
  short: Leahy Laws
  year: 1997
  domain: aid-sanctions
  usc: "22 U.S.C. 2378d; 10 U.S.C. 362"
  usc_path: "22/2378d"
  status: in-force
  status_note: >-
    In force. The State Department version is Section 620M of the Foreign
    Assistance Act; the Defense Department version was made permanent in Title 10
    in 2014.
  summary: >-
    Two parallel provisions that bar U.S. assistance to any unit of a foreign
    security force when there is credible information that the unit committed a
    gross violation of human rights. They began as an appropriations rider
    sponsored by Senator Patrick Leahy.
  provisions:
    - "22 U.S.C. 2378d: no assistance under the Foreign Assistance Act or Arms Export Control Act to a tainted unit."
    - "10 U.S.C. 362: no Defense Department training, equipment, or other assistance to a tainted unit."
    - "Assistance can resume if the foreign government is taking effective steps to bring those responsible to justice."
    - "Requires a vetting process and, for the State Department law, notice to the foreign government."
  significance: >-
    They operate at the level of the unit, which lets the United States keep
    working with a country while excluding specific battalions. They constrain
    assistance under the [[faa-1961]], the [[aeca-1976]], and the Defense Department programs in
    [[seccoop-2016|Chapter 16 of Title 10]]. Consistency of application across recipients is the usual
    criticism.
  tags: [human rights, security assistance, vetting, conditionality]

- id: farra-1998
  title: Foreign Affairs Reform and Restructuring Act of 1998
  short: Foreign Affairs Reform Act
  year: 1998
  enacted: "1998-10-21"
  domain: aid-sanctions
  public_law: "105-277"
  stat: "112 Stat. 2681-761"
  usc: "22 U.S.C. 6501 et seq."
  usc_path: "22/6501"
  status: in-force
  status_note: >-
    In force. In 2025 the administration moved USAID's remaining functions into
    the State Department and wound down most of the agency without new
    legislation; the statutory provisions on the agency have not been repealed and
    the action has been litigated. Check current status.
  summary: >-
    Division G of the FY1999 omnibus appropriations act. It folded the Arms
    Control and Disarmament Agency and the U.S. Information Agency into the State
    Department and, for the first time, gave USAID a statutory existence as an
    independent establishment.
  provisions:
    - "Abolished the Arms Control and Disarmament Agency and the U.S. Information Agency and moved their functions to State."
    - "Sec. 1413 (22 U.S.C. 6563): USAID recognized as an independent establishment, with the Administrator under the foreign policy guidance of the Secretary of State."
    - "Made international broadcasting independent under the Broadcasting Board of Governors."
  significance: >-
    It is the statute at the center of the argument over whether a President can
    dissolve or absorb USAID without Congress. It also explains why public
    diplomacy under the [[smith-mundt-1948]] sits inside State, and it amended
    the [[state-basic-1956]].
  tags: [USAID, State Department, reorganization, public diplomacy, arms control]

- id: millennium-challenge-2003
  title: Millennium Challenge Act of 2003
  short: Millennium Challenge Act
  year: 2004
  enacted: "2004-01-23"
  domain: aid-sanctions
  public_law: "108-199"
  stat: "118 Stat. 211"
  usc: "22 U.S.C. 7701 et seq."
  usc_path: "22/7701"
  status: in-force
  status_note: >-
    In force. The Millennium Challenge Corporation was targeted for deep cuts in
    2025. Check current status of the agency and its compacts.
  summary: >-
    Created the Millennium Challenge Corporation, a small government corporation
    that gives large, multi-year grants to poor countries that pass a scorecard of
    governance, economic freedom, and social investment indicators. It was enacted
    as Title VI of Division D of the Consolidated Appropriations Act, 2004.
  provisions:
    - "Eligibility determined by a board using published third-party indicators."
    - "Compacts of up to five years negotiated with and implemented by the partner country."
    - "Threshold programs for countries that fall just short of eligibility."
  significance: >-
    It was designed as an alternative to the model in the [[faa-1961]]: selective,
    country-led, and insulated from short-term foreign policy uses of aid. It is
    the standard example in debates about aid selectivity.
  tags: [foreign aid, development, governance indicators, selectivity]

- id: gfa-2019
  title: Global Fragility Act of 2019
  short: Global Fragility Act
  year: 2019
  enacted: "2019-12-20"
  domain: aid-sanctions
  public_law: "116-94"
  stat: "133 Stat. 2534"
  usc: "22 U.S.C. 9801 et seq."
  usc_path: "22/9801"
  status: partly-expired
  status_note: >-
    The policy framework remains in law, but the funding authorizations ran
    through fiscal year 2024. Reauthorization bills (H.R. 3005 and S. 2678, 119th
    Congress) were introduced in 2025 and had not been enacted as of this wiki's
    last review. Implementation largely stalled in 2025 after USAID and the State
    Department's conflict and stabilization bureau were dismantled.
  summary: >-
    Enacted as Title V of Division J of the Further Consolidated Appropriations
    Act, 2020. It directs a ten-year, whole-of-government strategy to prevent
    violent conflict and stabilize fragile states, applied first in a small set of
    priority countries.
  provisions:
    - "Sec. 504: a Global Fragility Strategy, issued in 2020 as the U.S. Strategy to Prevent Conflict and Promote Stability."
    - "Sec. 505: selection of priority countries and regions. In 2022 these were Haiti, Libya, Mozambique, Papua New Guinea, and Coastal West Africa (Benin, Cote d'Ivoire, Ghana, Guinea, Togo)."
    - "Sec. 506: ten-year country plans, with biennial reports to Congress."
    - "Sec. 509: the Prevention and Stabilization Fund and the Complex Crises Fund."
    - "State leads policy, USAID leads implementation, and Defense supports."
  significance: >-
    It is the main statutory expression of conflict prevention as a U.S. foreign
    policy goal and of long time horizons in assistance planning. It sits with
    the [[wiesel-2018]] and the [[wps-2017]] as a set of prevention statutes, and it draws
    on funding authorities in the [[faa-1961]].
  tags: [fragility, conflict prevention, stabilization, interagency, Coastal West Africa]
  sources:
    - label: "Congress.gov, S. 2678 Global Fragility Reauthorization Act (119th Congress)"
      url: "https://www.congress.gov/bill/119th-congress/senate-bill/2678/all-info"
    - label: "Congress.gov, H.R. 3005 Global Fragility Reauthorization Act (119th Congress)"
      url: "https://www.congress.gov/bill/119th-congress/house-bill/3005"
    - label: "Just Security, 'Global Fragility Act 2.0?' (2025)"
      url: "https://www.justsecurity.org/122579/global-fragility-act-us-peace-efforts/"

- id: wiesel-2018
  title: Elie Wiesel Genocide and Atrocities Prevention Act of 2018
  short: Elie Wiesel Act
  year: 2019
  enacted: "2019-01-14"
  domain: aid-sanctions
  public_law: "115-441"
  stat: "132 Stat. 5586"
  usc: "22 U.S.C. 2656 note"
  status: in-force
  status_note: In force. The annual reporting requirement had an initial six-year term.
  summary: >-
    Declares that preventing genocide and other atrocities is a national interest
    of the United States and requires the executive branch to organize, train, and
    report accordingly.
  provisions:
    - "Statement of policy that atrocity prevention is a core national security interest."
    - "Training for Foreign Service officers posted to countries at risk."
    - "Annual report to Congress on atrocity risks and the government's response, coordinated by an interagency body."
  significance: >-
    It gave statutory backing to the interagency atrocity prevention structure
    first set up in 2012. It is usually read together with the [[gfa-2019]], since
    both push the government toward early warning and prevention.
  tags: [atrocity prevention, genocide, early warning, interagency]

- id: wps-2017
  title: Women, Peace, and Security Act of 2017
  short: Women, Peace & Security Act
  year: 2017
  enacted: "2017-10-06"
  domain: aid-sanctions
  public_law: "115-68"
  stat: "131 Stat. 1202"
  usc: "22 U.S.C. 2152j et seq."
  usc_path: "22/2152j"
  status: in-force
  status_note: In force.
  summary: >-
    Makes it U.S. policy to promote the meaningful participation of women in
    conflict prevention, peace negotiations, and post-conflict recovery, and
    requires a government-wide strategy to carry that out.
  provisions:
    - "Required a national Women, Peace, and Security strategy, first issued in 2019, with agency implementation plans."
    - "Training for diplomatic, development, and defense personnel."
    - "Consultation with local women's groups and reporting to Congress."
  significance: >-
    The United States was the first country to put the agenda of U.N. Security
    Council Resolution 1325 into a comprehensive statute. It is a companion to
    the [[gfa-2019]] in the prevention and stabilization field.
  tags: [women peace and security, conflict prevention, peace processes]

- id: twea-1917
  title: Trading with the Enemy Act of 1917
  short: Trading with the Enemy Act
  year: 1917
  enacted: "1917-10-06"
  domain: aid-sanctions
  public_law: "65-91"
  stat: "40 Stat. 411"
  usc: "50 U.S.C. 4301-4341"
  usc_path: "50/4305"
  status: in-force
  status_note: >-
    In force, limited since 1977 to time of war, with pre-1977 programs
    grandfathered. The Cuba embargo regulations continue under it through an annual
    presidential extension.
  summary: >-
    A First World War statute giving the President sweeping control over trade and
    property involving enemy countries and nationals. Between 1933 and 1977 its
    Section 5(b) also applied in declared peacetime emergencies and became the
    all-purpose economic sanctions authority.
  provisions:
    - "Sec. 5(b): power to regulate or prohibit transactions in foreign exchange and property in which a foreign country or national has an interest."
    - "Authority to seize and vest enemy property."
    - "1977 amendment: confined Sec. 5(b) to wartime while allowing existing programs to be extended one year at a time."
  significance: >-
    It is the ancestor of modern sanctions law. Congress moved peacetime powers
    into [[ieepa-1977]], and the surviving Cuba program was later frozen in place
    by the [[helms-burton-1996]].
  tags: [sanctions, wartime powers, Cuba embargo, emergency powers]

- id: ieepa-1977
  title: International Emergency Economic Powers Act
  short: IEEPA
  year: 1977
  enacted: "1977-12-28"
  domain: aid-sanctions
  public_law: "95-223"
  stat: "91 Stat. 1625"
  usc: "50 U.S.C. 1701 et seq."
  usc_path: "50/1701"
  status: in-force
  status_note: >-
    In force. On February 20, 2026 the Supreme Court held 6 to 3 in Learning
    Resources, Inc. v. Trump that the act does not authorize the President to
    impose tariffs. Its use for sanctions was not at issue.
  summary: >-
    The workhorse of U.S. economic sanctions. After declaring a national emergency
    over an unusual and extraordinary threat that originates largely abroad, the
    President may block property and prohibit transactions involving foreign
    countries, entities, and individuals.
  provisions:
    - "Sec. 202: requires a declared national emergency specific to the threat."
    - "Sec. 203: power to investigate, block, regulate, or prohibit transactions and property subject to U.S. jurisdiction."
    - "Sec. 203(b): exceptions for personal communications, humanitarian donations, informational materials, and travel."
    - "Sec. 204: consultation with and reporting to Congress."
    - "Sec. 206: civil and criminal penalties, raised substantially in 2007."
  significance: >-
    Almost every program administered by the Treasury Department's Office of
    Foreign Assets Control rests on it, each tied to an emergency under
    the [[nea-1976]]. Statutory sanctions such as the [[glomag-2016]] and [[caatsa-2017]]
    are implemented through its machinery. After the 2026 tariff ruling, trade
    measures shifted to other authorities such as [[sec232-1962|Section 232]].
  tags: [sanctions, emergency powers, OFAC, tariffs, asset blocking]
  sources:
    - label: "Blakes, 'U.S. Supreme Court Strikes Down Certain Tariffs' (Feb. 24, 2026)"
      url: "https://www.blakes.com/insights/u-s-supreme-court-strikes-down-certain-tariffs-raising-new-uncertainty-for-canada-u-s-trade/"
    - label: "Wikipedia, Learning Resources, Inc. v. Trump (case summary and citations)"
      url: "https://en.wikipedia.org/wiki/Learning_Resources,_Inc._v._Trump"

- id: iran-sanctions-1996
  title: Iran Sanctions Act of 1996
  short: Iran Sanctions Act
  year: 1996
  enacted: "1996-08-05"
  domain: aid-sanctions
  public_law: "104-172"
  stat: "110 Stat. 1541"
  usc: "50 U.S.C. 1701 note"
  status: in-force
  status_note: >-
    In force through December 31, 2026 under the Iran Sanctions Extension Act
    (Pub. L. 114-277). The sunset is imminent as of this wiki's last review. Check
    whether it has been extended.
  summary: >-
    Originally the Iran and Libya Sanctions Act. It pioneered secondary sanctions
    by penalizing foreign companies, not just U.S. ones, that invest in Iran's
    energy sector.
  provisions:
    - "Requires the President to impose a menu of sanctions on firms making significant investments in Iranian petroleum development."
    - "Libya was removed in 2006."
    - "Expanded in 2010 by the Comprehensive Iran Sanctions, Accountability, and Divestment Act to cover refined petroleum and financial institutions, and again in 2012."
    - "Includes presidential waiver authority, which has been the main point of leverage in negotiations."
  significance: >-
    It established the model of extraterritorial sanctions later applied to Russia
    and others in [[caatsa-2017]]. Whether its sanctions could be waived was the
    statutory question behind the 2015 nuclear deal and the [[inara-2015]].
  tags: [sanctions, Iran, secondary sanctions, energy, sunset]

- id: inara-2015
  title: Iran Nuclear Agreement Review Act of 2015
  short: Iran Nuclear Review Act
  year: 2015
  enacted: "2015-05-22"
  domain: aid-sanctions
  public_law: "114-17"
  stat: "129 Stat. 201"
  usc: "42 U.S.C. 2160e"
  usc_path: "42/2160e"
  status: in-force
  status_note: In force. It would apply to any new nuclear agreement with Iran.
  summary: >-
    Gives Congress a defined period to review any nuclear agreement with Iran
    before the President may waive or suspend statutory sanctions, and requires
    regular compliance certifications afterward.
  provisions:
    - "The President must send Congress the agreement and related materials within five days."
    - "A 30-day review period (longer in some cases) during which statutory sanctions relief is barred."
    - "A compliance certification every 90 days."
    - "Expedited procedures for legislation to reimpose sanctions."
  significance: >-
    It is a template for congressional review of executive agreements that are not
    submitted as treaties. It was added as Section 135 of the [[aea-1954]] and is tied
    to the waiver authorities in the [[iran-sanctions-1996]].
  tags: [Iran, nuclear, congressional review, executive agreements, sanctions relief]

- id: helms-burton-1996
  title: Cuban Liberty and Democratic Solidarity (LIBERTAD) Act of 1996
  short: Helms-Burton Act
  year: 1996
  enacted: "1996-03-12"
  domain: aid-sanctions
  public_law: "104-114"
  stat: "110 Stat. 785"
  usc: "22 U.S.C. 6021 et seq."
  usc_path: "22/6021"
  status: in-force
  status_note: >-
    In force. Title III lawsuits, suspended by every President for 23 years, have
    been allowed since May 2019.
  summary: >-
    Wrote the Cuba embargo into statute so that a President cannot lift it alone,
    and extended its reach to foreign companies that use property confiscated by
    the Cuban government.
  provisions:
    - "Title I: codified the embargo regulations as they stood in 1996."
    - "Title II: conditions for a transition government that must be met before the embargo can end."
    - "Title III: a private right of action in U.S. courts against those who traffic in confiscated property."
    - "Title IV: denial of U.S. visas to executives of trafficking companies."
  significance: >-
    It is the leading example of Congress taking a sanctions program out of
    presidential hands. The embargo it codified was built on the [[twea-1917]] and on
    Section 620(a) of the [[faa-1961]].
  tags: [sanctions, Cuba embargo, extraterritoriality, codification]

- id: glomag-2016
  title: Global Magnitsky Human Rights Accountability Act
  short: Global Magnitsky Act
  year: 2016
  enacted: "2016-12-23"
  domain: aid-sanctions
  public_law: "114-328"
  stat: "130 Stat. 2533"
  usc: "22 U.S.C. 10101 et seq."
  usc_path: "22/10101"
  status: in-force
  status_note: >-
    In force. Its original six-year sunset was removed in 2022 by Pub. L. 117-110.
  summary: >-
    Authorizes visa bans and asset freezes against foreign individuals and
    entities responsible for serious human rights abuse or significant corruption
    anywhere in the world. It was enacted as part of the FY2017 defense
    authorization.
  provisions:
    - "Sanctions on those responsible for gross violations of human rights against people exposing government wrongdoing or exercising basic freedoms."
    - "Sanctions on officials and associates involved in significant corruption."
    - "Implemented through Executive Order 13818 (2017), which uses a broader standard of 'serious human rights abuse'."
    - "Congressional committees and nongovernmental groups may recommend targets."
  significance: >-
    It generalized the Russia-specific Sergei Magnitsky Act of 2012 and has been
    copied by the European Union, United Kingdom, Canada, and Australia. In
    practice it runs on [[ieepa-1977]] authority and it travelled to enactment
    inside [[ndaa-annual|the annual NDAA]].
  tags: [sanctions, human rights, corruption, targeted sanctions]

- id: caatsa-2017
  title: Countering America's Adversaries Through Sanctions Act
  short: CAATSA
  year: 2017
  enacted: "2017-08-02"
  domain: aid-sanctions
  public_law: "115-44"
  stat: "131 Stat. 886"
  usc: "22 U.S.C. 9401 et seq."
  usc_path: "22/9401"
  status: in-force
  status_note: In force.
  summary: >-
    A three-part sanctions law aimed at Iran, Russia, and North Korea. Its Russia
    title wrote existing executive order sanctions into statute and gave Congress
    the power to block the President from easing them.
  provisions:
    - "Title I: sanctions on Iran's ballistic missile program and the Islamic Revolutionary Guard Corps."
    - "Sec. 216: congressional review, with a possible resolution of disapproval, before Russia sanctions are eased."
    - "Sec. 231: sanctions on anyone making a significant transaction with Russia's defense or intelligence sectors."
    - "Title III: North Korea sanctions on shipping, labor, and finance."
  significance: >-
    Section 231 turned sanctions into an arms-transfer policy tool. It was applied
    to Turkey's defense procurement agency over the S-400 purchase and has shaped
    U.S. dealings with India, so it interacts with the [[aeca-1976]]. Like
    the [[glomag-2016]] it is carried out through [[ieepa-1977]].
  tags: [sanctions, Russia, Iran, North Korea, congressional review, arms transfers]

- id: caesar-2019
  title: Caesar Syria Civilian Protection Act of 2019
  short: Caesar Act
  year: 2019
  enacted: "2019-12-20"
  domain: aid-sanctions
  public_law: "116-92"
  stat: "133 Stat. 1198"
  usc: "22 U.S.C. 8791 note"
  status: repealed
  status_note: >-
    Repealed by the National Defense Authorization Act for Fiscal Year 2026
    (Pub. L. 119-60), signed December 18, 2025, a year after the fall of the Assad
    government.
  summary: >-
    Imposed secondary sanctions on foreign persons doing business with the Assad
    government's military, energy, aviation, and reconstruction sectors. It was
    named for the military photographer who documented deaths in Syrian detention
    and was enacted as Title LXXIV of the FY2020 defense authorization.
  provisions:
    - "Mandatory sanctions on foreign persons providing significant support to the Syrian government or to Russian and Iranian forces in Syria."
    - "Covered construction and engineering services for government-controlled reconstruction."
    - "Suspension and waiver conditions tied to an end to attacks on civilians, release of prisoners, and accountability."
  significance: >-
    It shows the full life of a sanctions statute: enacted in a defense bill,
    extended, then repealed in a later one once the target government fell. Both
    steps ran through [[ndaa-annual|the annual NDAA]].
  tags: [sanctions, Syria, secondary sanctions, repeal, reconstruction]
  sources:
    - label: "Wikipedia, National Defense Authorization Act for Fiscal Year 2026 (lists acts repealed)"
      url: "https://en.wikipedia.org/wiki/National_Defense_Authorization_Act_for_Fiscal_Year_2026"
