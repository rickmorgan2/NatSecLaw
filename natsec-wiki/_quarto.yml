project:
  type: website
  # GitHub Pages serves the site from the docs/ folder
  output-dir: docs
  # R code in every page runs from the project root, so pages in subfolders can source R/helpers.R
  execute-dir: project
  # regenerate statute, member, and study pages and the manifests from data/ before each render
  pre-render: R/build_pages.R
  # copy the archived first version into docs/v1
  post-render: R/post_render.R
  render:
    - "*.qmd"
    - "statutes/*.qmd"
    - "cases/*.qmd"
    - "members/*.qmd"
    - "study/*.qmd"
    - "study/units/*.qmd"
  resources:
    - "data/*.csv"
    - ".nojekyll"

website:
  title: "U.S. National Security Legislation"
  description: "A nonpartisan reference and study guide to the statutes, court decisions, and appropriations that shape U.S. national security policy."
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: "Statutes"
        href: index.qmd
      - text: "Court cases"
        href: cases/index.qmd
      - text: "Study guide"
        menu:
          - text: "Overview and the authority stack"
            href: study/index.qmd
          - text: "Flashcards"
            href: study/flashcards.qmd
          - text: "Timeline"
            href: study/timeline.qmd
          - text: "Glossary"
            href: study/glossary.qmd
      - text: "Knowledge graph"
        href: graph.qmd
      - text: "Reference"
        menu:
          - text: "Who's who"
            href: whos-who.qmd
          - text: "Title 10 and Title 50"
            href: title10-title50.qmd
          - text: "Sources"
            href: sources.qmd
      - text: "Members"
        menu:
          - text: "Compare the two lenses"
            href: members/index.qmd
          - text: "Rep. Jason Crow (CO-06)"
            href: members/crow.qmd
          - text: "Rep. Sara Jacobs (CA-51)"
            href: members/jacobs.qmd
      - text: "About"
        menu:
          - text: "About this wiki"
            href: about.qmd
          - text: "Manifest"
            href: manifest.qmd
  page-footer:
    left: "Independent reference project. Not affiliated with any congressional office. Not legal advice; check citations against the linked official text."
    right: "Version 2. Last updated November 24, 2026; each page shows when it was last checked."

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    smooth-scroll: true
    # no MathJax download, so the site works offline
    html-math-method: plain
    include-after-body:
      - _includes/wiki-data.html
      - _includes/site.html

execute:
  echo: false
  warning: false
  message: false
