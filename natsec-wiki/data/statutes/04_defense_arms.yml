- id: goldwater-nichols-1986
  title: Goldwater-Nichols Department of Defense Reorganization Act of 1986
  short: Goldwater-Nichols Act
  year: 1986
  enacted: "1986-10-01"
  domain: defense-arms
  layer: framework
  public_law: "99-433"
  stat: "100 Stat. 992"
  usc: "10 U.S.C. 151 et seq."
  usc_path: "10/151"
  status: in-force
  status_note: In force as amended, with notable adjustments in the FY2017 defense authorization.
  summary: >-
    The most important reorganization of the Defense Department since 1947. It
    took operational control away from the service chiefs, ran the chain of command
    from the President through the Secretary of Defense to the combatant
    commanders, and made the Chairman of the Joint Chiefs the principal military
    adviser.
  provisions:
    - "Chain of command: President to Secretary of Defense to combatant commanders, bypassing the service chiefs."
    - "The Chairman of the Joint Chiefs advises in his own right; the position of Vice Chairman was created."
    - "The services organize, train, and equip forces but do not command them in operations."
    - "Joint duty assignment made a requirement for promotion to general or flag rank."
    - "Sec. 603: requires the President's annual National Security Strategy report."
  significance: >-
    It was a response to the failures of interservice coordination in the Iran
    hostage rescue attempt and Grenada. It amends the [[nsa-1947]] and was followed
    weeks later by the [[nunn-cohen-1986]]. Proposals for a 'Goldwater-Nichols for the
    interagency' use it as shorthand for forcing joint action by statute.
  tags: [Department of Defense, organization, joint chiefs, combatant commands, civil-military relations]

- id: nunn-cohen-1986
  title: Nunn-Cohen Amendment
  short: Nunn-Cohen Amendment
  year: 1986
  enacted: "1986-11-14"
  domain: defense-arms
  layer: framework
  public_law: "99-661"
  stat: "100 Stat. 3816"
  usc: "10 U.S.C. 167"
  usc_path: "10/167"
  status: in-force
  status_note: In force as amended.
  summary: >-
    Section 1311 of the FY1987 defense authorization. It created U.S. Special
    Operations Command as a unified combatant command with its own budget line and
    a civilian assistant secretary to oversee it.
  provisions:
    - "Established U.S. Special Operations Command under a four-star commander."
    - "Gave the command service-like authority to train, equip, and budget for special operations forces."
    - "Created the Assistant Secretary of Defense for Special Operations and Low-Intensity Conflict."
    - "Listed special operations activities, including civil affairs and psychological operations."
  significance: >-
    Congress imposed it over Pentagon resistance to protect special operations
    from neglect by the services. It completes the reforms of
    the [[goldwater-nichols-1986]] and is an early case of [[ndaa-annual|the annual NDAA]] being used
    for structural change.
  tags: [special operations, organization, combatant commands, Department of Defense]

- id: ndaa-annual
  title: National Defense Authorization Act (annual series)
  short: NDAA (annual)
  year: 1961
  domain: defense-arms
  layer: authorizing
  usc: "Title 10 U.S.C. (various)"
  usc_titles: [10, 50]
  status: in-force
  status_note: >-
    The most recent enacted act is for fiscal year 2026 (Pub. L. 119-60, signed
    December 18, 2025). For fiscal year 2027 the House passed H.R. 8800 on July 22,
    2026; the Senate bill (S. 4784) had not passed, and final action was expected
    in the post-election session. Check current status.
  summary: >-
    The annual law that authorizes funding levels and sets policy for the Defense
    Department and the nuclear weapons programs of the Energy Department. It has
    been enacted every year for more than six decades, which makes it the most
    reliable vehicle in Congress for national security legislation of all kinds.
  provisions:
    - "Authorizes appropriations for procurement, research, operations, personnel, and military construction; actual funding comes from separate appropriations acts."
    - "Sets personnel policy, including pay, end strength, and military justice."
    - "Creates, extends, and limits security cooperation and counterterrorism authorities."
    - "Routinely carries unrelated or loosely related titles, such as the intelligence and State Department authorizations and sanctions measures."
  significance: >-
    Much of this wiki passed through it. It carried the [[glomag-2016]],
    the [[caesar-2019]], the [[ecra-2018]], [[firrma-2018|FIRRMA]], [[seccoop-2016|Chapter 16 of Title 10]], and
    the [[nunn-cohen-1986]], and the FY2026 act repealed the [[aumf-iraq-2002]] and
    the [[aumf-gulf-1991]]. Knowing which year's act did what is often the fastest way
    to trace a provision.
  tags: [defense authorization, legislative vehicle, Department of Defense, annual]
  sources:
    - label: "GovInfo, Pub. L. 119-60 (FY2026 NDAA text)"
      url: "https://www.govinfo.gov/link/plaw/119/public/60"
    - label: "Congress.gov, H.R. 8800 National Defense Authorization Act for Fiscal Year 2027"
      url: "https://www.congress.gov/bill/119th-congress/house-bill/8800"
    - label: "CRS IN12704, FY2027 NDAA: Status of Legislative Activity"
      url: "https://www.congress.gov/crs_external_products/IN/HTML/IN12704.html"
    - label: "Wikipedia, National Defense Authorization Act for Fiscal Year 2026"
      url: "https://en.wikipedia.org/wiki/National_Defense_Authorization_Act_for_Fiscal_Year_2026"

- id: seccoop-2016
  title: Security Cooperation Reform (FY2017 NDAA, Title 10 Chapter 16)
  short: Security Cooperation (Ch. 16)
  year: 2016
  enacted: "2016-12-23"
  domain: defense-arms
  layer: framework
  public_law: "114-328"
  stat: "130 Stat. 2000"
  usc: "10 U.S.C. 301-386"
  usc_path: "10/333"
  status: in-force
  status_note: In force and adjusted in most later defense authorizations.
  summary: >-
    The FY2017 defense authorization gathered dozens of scattered Defense
    Department authorities for training, equipping, and advising foreign forces
    into a single chapter of Title 10, with common definitions, oversight, and
    evaluation rules.
  provisions:
    - "10 U.S.C. 333: the global train-and-equip authority, successor to the Section 1206 program, requiring State Department concurrence."
    - "10 U.S.C. 332: institutional capacity building for foreign defense ministries."
    - "10 U.S.C. 383: assessment, monitoring, and evaluation of security cooperation programs."
    - "10 U.S.C. 362: the Defense Department Leahy law."
    - "Made the Defense Security Cooperation Agency responsible for the consolidated budget and workforce."
  significance: >-
    It marks the growth of the Defense Department's own assistance programs
    alongside State's traditional role under the [[faa-1961]] and the [[aeca-1976]]. The
    division of labor between Title 10 and Title 22 assistance is one of the
    central questions in security assistance policy.
  tags: [security cooperation, train and equip, security assistance, Title 10]

- id: dpa-1950
  title: Defense Production Act of 1950
  short: Defense Production Act
  year: 1950
  enacted: "1950-09-08"
  domain: defense-arms
  layer: framework
  public_law: "81-774"
  stat: "64 Stat. 798"
  usc: "50 U.S.C. 4501 et seq."
  usc_path: "50/4501"
  status: partly-expired
  status_note: >-
    Most authorities carry a sunset. They were extended from September 30, 2025 to
    January 30, 2026, then to September 30, 2026 by the FY2026 defense
    authorization. Whether they were extended again in fall 2026 was not confirmed
    at this wiki's last review. Section 721 (foreign investment review) is
    permanent. Check current status.
  summary: >-
    A Korean War statute that lets the President direct private industry in the
    interest of national defense: by putting government orders first in line, by
    financing new production capacity, and by organizing industry cooperation.
  provisions:
    - "Title I: priorities and allocations, requiring companies to accept and prioritize rated orders."
    - "Title III: loans, loan guarantees, purchase commitments, and direct investment to expand domestic production."
    - "Title VII: voluntary agreements with industry, industrial base surveys, and Section 721 on review of foreign investment."
    - "'National defense' is defined broadly to include energy, critical infrastructure, and emergency preparedness."
  significance: >-
    Its use has widened from munitions to pandemic supplies, critical minerals,
    and energy. Its permanent Section 721 is the home of the Committee on Foreign
    Investment in the United States, rewritten by [[firrma-2018|FIRRMA]].
  tags: [industrial base, emergency powers, supply chains, sunset, foreign investment]
  sources:
    - label: "CRS IN12484, Reauthorizing the Defense Production Act (updated Feb. 12, 2026)"
      url: "https://www.everycrsreport.com/reports/IN12484.html"

- id: aeca-1976
  title: Arms Export Control Act
  short: Arms Export Control Act
  year: 1976
  enacted: "1976-06-30"
  domain: defense-arms
  layer: framework
  public_law: "94-329"
  stat: "90 Stat. 729"
  usc: "22 U.S.C. 2751 et seq."
  usc_path: "22/2751"
  status: in-force
  status_note: >-
    In force. It began as the Foreign Military Sales Act of 1968 (Pub. L. 90-629)
    and took its present name in 1976.
  summary: >-
    Governs U.S. arms exports. It sets the purposes for which American weapons may
    be sold, requires licenses for commercial sales, and gives Congress advance
    notice of major sales and a procedure to block them.
  provisions:
    - "Secs. 3 and 4: recipients may use U.S. arms only for self-defense, internal security, and similar purposes, and may not retransfer them without consent."
    - "Sec. 36(b) and (c): notification to Congress of government and commercial sales above dollar thresholds, subject to a joint resolution of disapproval."
    - "Sec. 36 emergency provision: the President may bypass the review period by declaring an emergency."
    - "Sec. 38: licensing of commercial exports under the U.S. Munitions List and the International Traffic in Arms Regulations."
    - "Sec. 40A: end-use monitoring."
  significance: >-
    Congress has never blocked a sale through a resolution of disapproval that
    survived a veto, so its influence runs through informal holds and conditions.
    The act pairs with the [[faa-1961]] on the assistance side, with the [[ecra-2018]] for
    dual-use goods, and is limited by the [[leahy-laws]] and the [[symington-glenn]].
  tags: [arms transfers, arms sales, export controls, congressional review, ITAR]

- id: symington-glenn
  title: Symington and Glenn Amendments
  short: Symington-Glenn Amendments
  year: 1976
  domain: defense-arms
  layer: provision
  usc: "22 U.S.C. 2799aa, 2799aa-1"
  usc_path: "22/2799aa"
  status: in-force
  status_note: >-
    In force as Sections 101 and 102 of the Arms Export Control Act, where they
    were moved from the Foreign Assistance Act in 1994.
  summary: >-
    Two nonproliferation amendments from 1976 and 1977 that cut off U.S. economic
    and military aid to countries that trade in nuclear enrichment or reprocessing
    technology outside international safeguards, or that test a nuclear device.
  provisions:
    - "Symington (Sec. 101): aid cutoff for delivering or receiving unsafeguarded enrichment equipment or technology."
    - "Glenn (Sec. 102): aid cutoff for reprocessing transfers, and mandatory sanctions when a non-nuclear-weapon state detonates a nuclear device."
    - "Presidential waivers are available in narrow circumstances, and Congress has added country-specific waivers."
  significance: >-
    The Glenn sanctions were triggered against both India and Pakistan after
    their 1998 tests and then waived by legislation. They are the clearest case of
    aid conditionality used for nonproliferation, connecting the [[faa-1961]],
    the [[aeca-1976]], and the [[aea-1954]].
  tags: [nonproliferation, nuclear, conditionality, sanctions, South Asia]

- id: aea-1954
  title: Atomic Energy Act of 1954
  short: Atomic Energy Act
  year: 1954
  enacted: "1954-08-30"
  domain: defense-arms
  layer: framework
  public_law: "83-703"
  stat: "68 Stat. 919"
  usc: "42 U.S.C. 2011 et seq."
  usc_path: "42/2011"
  status: in-force
  status_note: In force as amended, notably by the Nuclear Non-Proliferation Act of 1978 (Pub. L. 95-242).
  summary: >-
    The governing law for both civilian and military uses of nuclear material in
    the United States. It keeps nuclear weapons under civilian control, creates a
    separate classification regime for nuclear information, and sets the terms for
    nuclear cooperation with other countries.
  provisions:
    - "Restricted Data: nuclear weapons design information is classified from creation, outside the ordinary executive order system."
    - "Sec. 123: agreements for peaceful nuclear cooperation must meet nine nonproliferation criteria and lie before Congress for review."
    - "Secs. 91 and 144: military applications and defense cooperation with allies."
    - "Sec. 57b: controls on assistance to foreign nuclear programs."
    - "Sec. 135: congressional review of nuclear agreements with Iran."
  significance: >-
    Every civil nuclear deal, from India in 2008 to current proposals in the
    Gulf, is a 'Section 123' question. Naval reactor cooperation under AUKUS runs
    through its defense provisions. The [[inara-2015]] amended it and
    the [[symington-glenn]] reinforce it from the aid side.
  tags: [nuclear, nonproliferation, classification, civilian control, 123 agreements]

- id: nunn-lugar-1991
  title: Soviet Nuclear Threat Reduction Act of 1991 (Nunn-Lugar)
  short: Nunn-Lugar Act
  year: 1991
  enacted: "1991-12-12"
  domain: defense-arms
  layer: authorizing
  public_law: "102-228"
  stat: "105 Stat. 1691"
  usc: "22 U.S.C. 2551 note; 50 U.S.C. 3701 et seq."
  status: in-force
  status_note: >-
    The program continues as the Defense Department's Cooperative Threat Reduction
    program, restated in permanent law in the FY2015 defense authorization.
    Cooperation with Russia itself ended in the 2010s.
  summary: >-
    Authorized the Defense Department to spend its own funds helping the former
    Soviet republics secure, transport, and dismantle nuclear, chemical, and other
    weapons after the Soviet collapse.
  provisions:
    - "Initial authority to transfer up to $400 million from defense accounts."
    - "Assistance for destroying weapons, safeguarding them in transit and storage, and preventing proliferation."
    - "Conditions on recipients, including commitments to arms control compliance."
    - "Later widened to cover biological threats and countries outside the former Soviet Union."
  significance: >-
    It helped remove nuclear weapons from Ukraine, Kazakhstan, and Belarus and is
    the standard example of defense spending used for prevention. Its annual
    funding and limits were set through [[ndaa-annual|the annual NDAA]].
  tags: [nonproliferation, nuclear, threat reduction, Russia, prevention]

- id: ecra-2018
  title: Export Control Reform Act of 2018
  short: Export Control Reform Act
  year: 2018
  enacted: "2018-08-13"
  domain: defense-arms
  layer: framework
  public_law: "115-232"
  stat: "132 Stat. 1636"
  usc: "50 U.S.C. 4801-4852"
  usc_path: "50/4811"
  status: in-force
  status_note: In force with no sunset.
  summary: >-
    The permanent statutory basis for Commerce Department controls on dual-use
    exports. It replaced the Export Administration Act of 1979, which had lapsed
    and been kept alive for years by emergency declarations. It was enacted as
    part of the FY2019 defense authorization.
  provisions:
    - "Authorizes the Export Administration Regulations and the Commerce Control List."
    - "Sec. 1758: an interagency process to identify and control emerging and foundational technologies."
    - "Supports end-user controls such as the Entity List."
    - "Civil and criminal penalties and enforcement authorities."
  significance: >-
    It is the legal base for controls on advanced semiconductors and chipmaking
    tools to China. It ended reliance on [[ieepa-1977]] for routine export
    controls, complements the [[aeca-1976]] on the munitions side, and was paired with
    [[firrma-2018|FIRRMA]] as a two-part response to technology transfer.
  tags: [export controls, dual-use, technology, China, semiconductors]

- id: firrma-2018
  title: Foreign Investment Risk Review Modernization Act of 2018
  short: FIRRMA (CFIUS)
  year: 2018
  enacted: "2018-08-13"
  domain: defense-arms
  layer: framework
  public_law: "115-232"
  stat: "132 Stat. 1636"
  usc: "50 U.S.C. 4565"
  usc_path: "50/4565"
  status: in-force
  status_note: In force.
  summary: >-
    Expanded the Committee on Foreign Investment in the United States, which
    reviews foreign acquisitions for national security risk. Coverage now extends
    beyond takeovers to minority stakes in sensitive businesses and to some real
    estate.
  provisions:
    - "Jurisdiction over non-controlling investments in businesses dealing with critical technology, critical infrastructure, or sensitive personal data."
    - "Jurisdiction over real estate transactions near military and other sensitive sites."
    - "Mandatory filings for certain transactions, including those with foreign government involvement."
    - "Filing fees, longer review timelines, and more resources for the committee."
  significance: >-
    The committee dates to a 1975 executive order and the 1988 Exon-Florio
    amendment. This act rewrote Section 721 of the [[dpa-1950]] and was enacted with
    the [[ecra-2018]] in the same title of [[ndaa-annual|the FY2019 NDAA]].
  tags: [foreign investment, CFIUS, technology, China, critical infrastructure]

- id: tra-1979
  title: Taiwan Relations Act
  short: Taiwan Relations Act
  year: 1979
  enacted: "1979-04-10"
  domain: defense-arms
  layer: authorizing
  public_law: "96-8"
  stat: "93 Stat. 14"
  usc: "22 U.S.C. 3301 et seq."
  usc_path: "22/3301"
  status: in-force
  status_note: In force, supplemented by the Taiwan Enhanced Resilience Act in the FY2023 defense authorization.
  summary: >-
    Passed after the United States recognized the People's Republic of China and
    ended formal relations with Taipei. It preserves unofficial ties, commits the
    United States to supply defensive arms, and states U.S. concern about any
    coercive resolution of Taiwan's status.
  provisions:
    - "Sec. 2: any non-peaceful effort to determine Taiwan's future is a threat to peace and of grave concern to the United States."
    - "Sec. 3: the United States will make available defensive arms, with the President and Congress determining what is needed."
    - "Requires the United States to maintain the capacity to resist force or coercion against Taiwan."
    - "Established the American Institute in Taiwan to conduct unofficial relations."
  significance: >-
    Congress wrote it to be firmer than the administration's draft, and it is the
    statutory half of 'strategic ambiguity': it promises capacity and arms, not
    intervention. Arms sales under it follow the [[aeca-1976]] procedures, and recent
    financing and stockpile authorities came through [[ndaa-annual|the annual NDAA]].
  tags: [Taiwan, arms transfers, China, strategic ambiguity, East Asia]
