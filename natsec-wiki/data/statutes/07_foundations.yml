- id: constitution-war-powers
  title: "U.S. Constitution: War and Foreign Affairs Powers"
  short: Constitution (war powers)
  year: 1788
  domain: foundations
  layer: constitution
  status: in-force
  status_note: In force. Its allocation of war and foreign affairs powers is settled more by practice than by court rulings.
  summary: >-
    The Constitution divides national security powers between Congress and the
    President and leaves the boundary largely undefined. Every statute in this
    wiki is an exercise of, or an argument about, one of these clauses.
  provisions:
    - "Art. I, Sec. 8, cl. 11: Congress declares war and grants letters of marque and reprisal."
    - "Art. I, Sec. 8, cls. 12-14: Congress raises and supports armies (with appropriations limited to two years), maintains a navy, and makes rules for the armed forces."
    - "Art. I, Sec. 8, cls. 15-16: Congress provides for calling forth and organizing the militia."
    - "Art. I, Sec. 8, cl. 18 and Sec. 9, cl. 7: the necessary and proper power and the requirement that money be spent only under appropriations."
    - "Art. II, Sec. 2: the President is commander in chief, makes treaties with the consent of two thirds of the Senate, and appoints ambassadors and officers."
    - "Art. II, Sec. 3 and Art. IV, Sec. 4: the duty to see the laws faithfully executed, and the guarantee to protect states against invasion and domestic violence."
  significance: >-
    The standard framework for disputes is Justice Jackson's concurrence in
    Youngstown Sheet and Tube Co. v. Sawyer (1952): presidential power is
    strongest when Congress has authorized the action and weakest when Congress
    has forbidden it. That is why framework statutes such as the [[wpr-1973]] and
    the [[nea-1976]] matter even when they are not enforced in court. The militia
    clauses are the source of the [[militia-acts-1792]] and, through them, the
    [[insurrection-1807]].
  tags: [Constitution, separation of powers, commander in chief, declare war, militia clauses]
  sources:
    - label: "Constitution Annotated (Congress.gov), Article I, Section 8: powers of Congress"
      url: "https://constitution.congress.gov/browse/article-1/section-8/"
    - label: "Constitution Annotated (Congress.gov), Article II, Section 2: commander in chief, treaties, appointments"
      url: "https://constitution.congress.gov/browse/article-2/section-2/"
    - label: "Constitution Annotated (Congress.gov)"
      url: "https://constitution.congress.gov"
    - label: "National Archives, Constitution of the United States: A Transcription"
      url: "https://www.archives.gov/founding-docs/constitution-transcript"

- id: declarations-of-war
  title: Declarations of War (1812-1942)
  short: Declarations of War
  year: 1812
  domain: foundations
  layer: authorizing
  status: in-force
  status_note: >-
    No declaration has been enacted since June 1942. Statutes triggered by a
    declared war remain on the books and would activate on a new declaration.
  summary: >-
    Congress has declared war eleven times, in five conflicts: the War of 1812,
    the Mexican-American War, the Spanish-American War, and the two world wars.
    Each declaration was a joint resolution or act signed by the President.
  provisions:
    - "A declaration creates a state of war under international and domestic law and authorizes the President to use the whole of the armed forces."
    - "It automatically activates standby statutes written for 'time of war', covering enemy aliens, trade with the enemy, surveillance, and mobilization."
    - "The last declarations, against Bulgaria, Hungary, and Romania, were approved on June 5, 1942."
  significance: >-
    Since 1942 Congress has authorized force by narrower resolutions such as the
    [[aumf-2001]], which do not trigger most wartime statutes. That is why the
    declared-war requirement in the [[alien-enemies-1798]] and the
    [[twea-1917]] still matters, and why Section 2(c) of the [[wpr-1973]] lists a
    declaration of war first among the grounds for using force.
  tags: [declare war, use of force, wartime statutes, Congress]
  sources:
    - label: "CRS RL31133, Declarations of War and Authorizations for the Use of Military Force"
      url: "https://www.congress.gov/crs-product/RL31133"

- id: militia-acts-1792
  title: Militia Acts of 1792
  short: Militia Acts of 1792
  year: 1792
  enacted: "1792-05-02"
  domain: foundations
  layer: framework
  stat: "1 Stat. 264; 1 Stat. 271"
  usc: "10 U.S.C. 246"
  usc_path: "10/246"
  status: superseded
  status_note: >-
    Replaced in stages by the Militia Act of 1795, the Insurrection Act of 1807,
    and the Militia Act of 1903. The statutory definition of the militia survives
    at 10 U.S.C. 246.
  summary: >-
    Two acts passed a week apart. The first let the President call out state
    militias to repel invasion, suppress insurrection, and enforce federal law.
    The second required the states to enroll and organize a militia of adult male
    citizens.
  provisions:
    - "Calling Forth Act (May 2, 1792): presidential authority to call the militia in case of invasion, insurrection, or obstruction of the laws, at first only after a federal judge certified the need."
    - "Required a proclamation ordering insurgents to disperse before force was used."
    - "Uniform Militia Act (May 8, 1792): enrollment of able-bodied free white male citizens aged 18 to 45, who were to arm themselves."
  significance: >-
    This was Congress's first delegation of its militia power, used by Washington
    in the Whiskey Rebellion. The dispersal proclamation and the three triggers
    carry straight through to the [[insurrection-1807]] and to Section 12406 in
    the [[reserve-mobilization|mobilization authorities]]. Its failure as a
    system for organizing forces led to the [[dick-act-1903]].
  tags: [militia, domestic deployment, delegation, early republic]

- id: neutrality-1794
  title: Neutrality Act of 1794
  short: Neutrality Act
  year: 1794
  enacted: "1794-06-05"
  domain: foundations
  layer: framework
  stat: "1 Stat. 381"
  usc: "18 U.S.C. 958-962"
  usc_path: "18/960"
  status: in-force
  status_note: In force as recodified. Prosecutions are rare.
  summary: >-
    Makes it a crime for private persons to wage war from U.S. territory against
    a country with which the United States is at peace. It was passed to keep
    Americans from dragging the country into the wars of the French Revolution.
  provisions:
    - "18 U.S.C. 960: organizing or funding a military expedition from the United States against a friendly foreign state."
    - "18 U.S.C. 958-959: accepting a foreign commission, or enlisting others in foreign service, against a friendly state."
    - "18 U.S.C. 962: arming a vessel for use against a friendly state."
  significance: >-
    It establishes that the decision to use force abroad belongs to the
    government and not to private citizens. The [[logan-1799]] applies the same
    idea to diplomacy, and the [[espionage-1917]] added to its enforcement
    provisions. It is distinct from the arms embargo laws of the 1930s that share
    its name.
  tags: [neutrality, private military action, criminal law, early republic]

- id: alien-enemies-1798
  title: Alien Enemies Act of 1798
  short: Alien Enemies Act
  year: 1798
  enacted: "1798-07-06"
  domain: foundations
  layer: framework
  stat: "1 Stat. 577"
  usc: "50 U.S.C. 21-24"
  usc_path: "50/21"
  status: in-force
  status_note: >-
    In force. A March 2025 proclamation invoked it against alleged members of a
    Venezuelan gang, its first use outside a declared war. The Supreme Court
    required notice and a chance to seek habeas review and later blocked removals
    of the plaintiffs. A Fifth Circuit panel found the invocation unlawful in
    September 2025; that opinion was vacated, and in August 2026 the full court
    dismissed the case as moot without ruling on the question. Check current
    status.
  summary: >-
    The only one of the Alien and Sedition Acts still in force. During a declared
    war, or an invasion or predatory incursion by a foreign nation or government,
    the President may detain, restrict, and remove nationals of the hostile
    country.
  provisions:
    - "Trigger: a declared war, or an invasion or predatory incursion perpetrated, attempted, or threatened by a foreign nation or government."
    - "Applies to natives, citizens, denizens, or subjects of the hostile nation aged fourteen and older who are not naturalized."
    - "The President sets the terms by proclamation; courts may hear whether a person falls within the act."
  significance: >-
    Used in the War of 1812 and both world wars, it is the oldest wartime
    authority in Title 50 and the counterpart for persons of what the
    [[twea-1917]] does for property. The dispute since 2025 is whether its
    triggers can be met without one of the [[declarations-of-war]] and by a
    non-state group.
  tags: [wartime powers, detention, removal, habeas corpus, Title 50]
  sources:
    - label: "Volokh Conspiracy, 'En Banc Fifth Circuit Dismisses Alien Enemies Act Case as Moot' (Aug. 13, 2026)"
      url: "https://reason.com/volokh/2026/08/13/en-banc-fifth-circuit-dismisses-alien-enemies-act-case-as-moot/"
    - label: "Wikipedia, W.M.M. v. Trump (case history and citations)"
      url: "https://en.wikipedia.org/wiki/W.M.M._v._Trump"

- id: logan-1799
  title: Logan Act
  short: Logan Act
  year: 1799
  enacted: "1799-01-30"
  domain: foundations
  layer: provision
  stat: "1 Stat. 613"
  usc: "18 U.S.C. 953"
  usc_path: "18/953"
  status: in-force
  status_note: In force. There have been two indictments, in 1803 and 1852, and no convictions.
  summary: >-
    Bars private citizens from corresponding with a foreign government, without
    authority, in order to influence its conduct in a dispute with the United
    States or to defeat U.S. measures.
  provisions:
    - "Applies to any U.S. citizen acting without the authority of the United States."
    - "Covers correspondence or intercourse with a foreign government or its agents."
    - "Requires intent to influence that government's conduct in a dispute with the United States, or to defeat U.S. measures."
  significance: >-
    It is cited far more often than it is used, usually as a political charge
    against unofficial diplomacy. It expresses the principle that the government
    speaks with one voice abroad, and it is the diplomatic counterpart of the
    [[neutrality-1794]]. Modern concerns about foreign influence are handled
    through [[fara-1938|FARA]] instead.
  tags: [private diplomacy, foreign relations, criminal law, early republic]

- id: dick-act-1903
  title: Militia Act of 1903 (Dick Act)
  short: Militia Act of 1903
  year: 1903
  enacted: "1903-01-21"
  domain: foundations
  layer: framework
  public_law: "57-33"
  stat: "32 Stat. 775"
  usc: "32 U.S.C. 101 et seq."
  usc_path: "32/101"
  status: superseded
  status_note: Carried forward by the National Defense Act of 1916 and now reflected in Titles 10 and 32.
  summary: >-
    Replaced the 1792 militia system. It divided the militia into an organized
    part, the National Guard, and an unorganized reserve, and gave the Guard
    federal funding and equipment in exchange for meeting Army standards.
  provisions:
    - "Recognized the National Guard as the organized militia of the states."
    - "Federal arms, funding, and inspection in return for conformity with Regular Army organization and training."
    - "Limited federal call-ups in time and, as first interpreted, to service inside the United States."
  significance: >-
    It created the National Guard as an institution. The limits on overseas
    service were removed by the [[national-defense-act-1916]], and the dual
    state and federal character it began is the root of
    [[title32-usc|Title 32]].
  tags: [National Guard, militia, organization, federalism]

- id: national-defense-act-1916
  title: National Defense Act of 1916
  short: National Defense Act (1916)
  year: 1916
  enacted: "1916-06-03"
  domain: foundations
  layer: framework
  public_law: "64-85"
  stat: "39 Stat. 166"
  usc: "10 U.S.C. 10101 et seq."
  usc_path: "10/10101"
  usc_titles: [32]
  status: superseded
  status_note: Amended heavily in 1920 and 1933 and absorbed into Titles 10 and 32 by the 1956 codification.
  summary: >-
    The first comprehensive statute organizing U.S. land forces. It defined the
    Army as the Regular Army, the National Guard, and a federal reserve, and it
    let the President draft the Guard into federal service for use overseas.
  provisions:
    - "Defined the components of the Army and expanded its authorized strength."
    - "Guard members took a dual oath to state and nation and could be drafted into federal service in war."
    - "Created the Reserve Officers' Training Corps and an organized reserve."
    - "Gave the President authority to place obligatory orders with industry in war, an early precedent for defense production powers."
  significance: >-
    It set the three-component structure the Army still has. The 1933 amendments
    completed the design by making Guard members simultaneously members of a
    federal reserve component, which is what today's
    [[reserve-mobilization|mobilization authorities]] operate on. Its industrial
    mobilization section anticipates the [[dpa-1950]].
  tags: [Army, National Guard, reserves, mobilization, organization]

- id: nsa-amendments-1949
  title: National Security Act Amendments of 1949
  short: NSA Amendments (1949)
  year: 1949
  enacted: "1949-08-10"
  domain: defense-arms
  layer: framework
  public_law: "81-216"
  stat: "63 Stat. 578"
  usc: "10 U.S.C. 111, 151"
  usc_path: "10/111"
  status: in-force
  status_note: In force as carried into Title 10 and revised by the 1958 and 1986 reorganizations.
  summary: >-
    Fixed the weak structure created in 1947. It turned the National Military
    Establishment into the Department of Defense, an executive department, and
    reduced the Army, Navy, and Air Force to military departments under the
    Secretary of Defense.
  provisions:
    - "Created the Department of Defense as an executive department."
    - "Removed the service secretaries from the cabinet and from the National Security Council."
    - "Created the position of Chairman of the Joint Chiefs of Staff, without command authority."
    - "Added a deputy secretary and comptroller and gave the Secretary control of the budget."
  significance: >-
    It is the first of three corrections to the [[nsa-1947]], followed by the
    [[dod-reorg-1958]] and the [[goldwater-nichols-1986]], each of which moved
    authority from the services toward the Secretary and joint commanders.
  tags: [Department of Defense, organization, joint chiefs, civilian control]

- id: lend-lease-1941
  title: Lend-Lease Act
  short: Lend-Lease Act
  year: 1941
  enacted: "1941-03-11"
  domain: defense-arms
  layer: authorizing
  public_law: "77-11"
  stat: "55 Stat. 31"
  status: superseded
  status_note: Expired after the Second World War. A Ukraine-specific lend-lease law enacted in 2022 lapsed in 2023 without being used.
  summary: >-
    Authorized the President to sell, transfer, lend, or lease defense articles
    to any country whose defense he judged vital to the defense of the United
    States. It ended the cash-and-carry limits of the 1930s neutrality laws nine
    months before Pearl Harbor.
  provisions:
    - "Transfer of defense articles and information to countries whose defense the President deemed vital to the United States."
    - "Terms of repayment left to the President, 'in kind or property, or any other direct or indirect benefit'."
    - "Reporting to Congress and a provision for termination by concurrent resolution."
  significance: >-
    It is the origin of large-scale U.S. arms transfers as an instrument of
    policy short of war. Its postwar successors were the [[mutual-security-1951]]
    and then the framework split between the [[faa-1961]] and the [[aeca-1976]].
  tags: [arms transfers, Second World War, security assistance, presidential discretion]
  sources:
    - label: "National Archives, Milestone Documents: Lend-Lease Act (1941)"
      url: "https://www.archives.gov/milestone-documents/lend-lease-act"

- id: mutual-security-1951
  title: Mutual Security Act of 1951
  short: Mutual Security Act
  year: 1951
  enacted: "1951-10-10"
  domain: aid-sanctions
  layer: authorizing
  public_law: "82-165"
  stat: "65 Stat. 373"
  status: superseded
  status_note: Replaced by the Mutual Security Act of 1954 and then by the Foreign Assistance Act of 1961.
  summary: >-
    Merged the Marshall Plan's economic aid, military assistance to allies, and
    technical assistance into one program under one agency, with the stated
    purpose of strengthening the free world against Soviet power.
  provisions:
    - "Created the Mutual Security Agency to supervise all foreign aid."
    - "Combined military, economic, and technical assistance authorities."
    - "Tied aid to the recipient's contribution to collective defense."
  significance: >-
    It set the Cold War pattern of treating economic and military aid as one
    security instrument. The [[faa-1961]] was written to separate them again,
    which is the origin of the divide between development and security
    assistance. It followed the wartime model of the [[lend-lease-1941]].
  tags: [foreign aid, security assistance, Cold War, Marshall Plan]

- id: selective-service-1948
  title: Military Selective Service Act
  short: Selective Service Act
  year: 1948
  enacted: "1948-06-24"
  domain: defense-arms
  layer: framework
  public_law: "80-759"
  stat: "62 Stat. 604"
  usc: "50 U.S.C. 3801 et seq."
  usc_path: "50/3801"
  status: partly-expired
  status_note: >-
    The registration requirement is in force. Authority to induct expired on July
    1, 1973, so a draft would require new legislation. Changes to registration
    have been proposed in recent defense bills. Check current status.
  summary: >-
    The standing law of conscription. It requires men to register at 18 and
    maintains the Selective Service System so that a draft could be run if
    Congress and the President restored the power to induct.
  provisions:
    - "Registration of male citizens and most male residents aged 18 through 25."
    - "Classification, deferment, and conscientious objector provisions."
    - "Local boards and a lottery system for any future induction."
    - "Induction authority lapsed in 1973; registration was suspended in 1975 and resumed in 1980."
  significance: >-
    It is the legal basis of the all-volunteer force's backstop. Any large war
    would test it before it tested the [[reserve-mobilization|mobilization
    authorities]]. Proposals to automate registration or extend it to women
    usually move through [[ndaa-annual|the annual NDAA]].
  tags: [conscription, draft, manpower, mobilization, Title 50]

- id: title10-usc
  title: "Title 10, U.S. Code: Armed Forces"
  short: Title 10 U.S.C.
  year: 1956
  enacted: "1956-08-10"
  domain: foundations
  layer: code
  code_title: 10
  public_law: "84-1028"
  stat: "70A Stat. 1"
  usc: "10 U.S.C. 101 et seq."
  usc_path: "10"
  status: in-force
  status_note: In force as positive law, amended every year through the defense authorization.
  summary: >-
    The title of the U.S. Code that governs the armed forces: their organization,
    command, personnel, training, procurement, and reserve components. Congress
    enacted it as positive law in 1956, so its text is itself the law and not
    just evidence of it.
  provisions:
    - "Subtitle A, General Military Law: the Department of Defense, the Joint Chiefs and combatant commands, personnel, the Uniform Code of Military Justice, training, and acquisition."
    - "Subtitle B: Army. Subtitle C: Navy and Marine Corps. Subtitle D: Air Force and Space Force."
    - "Subtitle E: Reserve Components, including the mobilization authorities."
    - "Key operational sections include 113 and 162-164 (command), 127e (special operations support), 251-255 (insurrection), 271-284 (support to law enforcement), 301-386 (security cooperation), and 394 (cyber)."
  significance: >-
    'Title 10' is shorthand for military authority exercised through the chain
    of command, as opposed to intelligence authority under
    [[title50-usc|Title 50]], diplomatic and assistance authority under
    [[title22-usc|Title 22]], or National Guard service under
    [[title32-usc|Title 32]]. Its structure was set by the [[nsa-1947]] and its
    amendments, and nearly all changes now come through
    [[ndaa-annual|the annual NDAA]].
  tags: [Title 10, armed forces, positive law, U.S. Code]

- id: title50-usc
  title: "Title 50, U.S. Code: War and National Defense"
  short: Title 50 U.S.C.
  year: 1926
  domain: foundations
  layer: code
  code_title: 50
  usc: "50 U.S.C. 1 et seq."
  usc_path: "50"
  status: in-force
  status_note: >-
    In force. It is not positive law: it is an editorial compilation of separate
    statutes, so the underlying acts control. Many sections were renumbered in
    2013 and the former appendix was folded into the main title in 2015.
  summary: >-
    The title of the U.S. Code that collects the laws on war powers, emergency
    powers, intelligence, and economic defense. Unlike Title 10 it has no single
    design; it is a shelf holding statutes passed over two centuries.
  provisions:
    - "Wartime authorities: the Alien Enemies Act (sec. 21) and the Trading with the Enemy Act (sec. 4301)."
    - "War and emergency powers: the War Powers Resolution (sec. 1541), the National Emergencies Act (sec. 1601), and the International Emergency Economic Powers Act (sec. 1701)."
    - "Intelligence: the National Security Act (sec. 3001), covert action and oversight (secs. 3091-3093), the CIA Act (sec. 3501), and FISA (sec. 1801)."
    - "Economic defense: the Defense Production Act (sec. 4501), foreign investment review (sec. 4565), and export controls (sec. 4801)."
    - "Manpower: the Military Selective Service Act (sec. 3801)."
  significance: >-
    'Title 50' is shorthand for intelligence authority, above all covert action
    under a presidential finding, in contrast to military authority under
    [[title10-usc|Title 10]]. The shorthand understates the title: it also holds
    the main checks on presidential war and emergency power. The core of its
    intelligence chapters is the [[nsa-1947]].
  tags: [Title 50, intelligence, emergency powers, U.S. Code, covert action]

- id: title22-usc
  title: "Title 22, U.S. Code: Foreign Relations and Intercourse"
  short: Title 22 U.S.C.
  year: 1926
  domain: foundations
  layer: code
  code_title: 22
  usc: "22 U.S.C. 1 et seq."
  usc_path: "22"
  status: in-force
  status_note: In force. Like Title 50 it is not positive law, so the underlying acts control.
  summary: >-
    The title of the U.S. Code for diplomacy and foreign assistance. It holds
    the State Department's authorities, the Foreign Service, foreign aid, arms
    export controls, and most country-specific sanctions and policy statutes.
  provisions:
    - "Department of State organization and the Foreign Service, including chief of mission authority (sec. 3927)."
    - "Foreign assistance (sec. 2151 and following) and arms export control (sec. 2751 and following)."
    - "Participation in the United Nations (sec. 287) and registration of foreign agents (sec. 611)."
    - "Country and issue statutes, including the Taiwan Relations Act, Cuba and Russia sanctions laws, human rights sanctions, and the Global Fragility Act."
  significance: >-
    'Title 22' is shorthand for security assistance run by the State Department,
    in contrast to security cooperation run by the Defense Department under
    [[title10-usc|Title 10]]. The two foundations of that system are the
    [[faa-1961]] and the [[aeca-1976]].
  tags: [Title 22, foreign relations, security assistance, State Department, U.S. Code]

- id: title32-usc
  title: "Title 32, U.S. Code: National Guard"
  short: Title 32 U.S.C.
  year: 1956
  enacted: "1956-08-10"
  domain: foundations
  layer: code
  code_title: 32
  public_law: "84-1028"
  stat: "70A Stat. 596"
  usc: "32 U.S.C. 101 et seq."
  usc_path: "32"
  status: in-force
  status_note: In force as positive law, enacted together with Title 10 in 1956.
  summary: >-
    The title of the U.S. Code for the National Guard when it is not in federal
    service. It governs organization, federal funding, and training of the Guard
    while it remains under the command of state governors.
  provisions:
    - "Federal recognition, organization, and equipment standards for the Guard."
    - "Sec. 502(f): Guard members may perform training or other duty, including operational support requested by the President or Secretary of Defense, while under state command and federally paid."
    - "Sec. 112: counterdrug support under governors' plans."
    - "Chapter 9: homeland defense activities."
  significance: >-
    'Title 32 status' is the middle position between purely state service and
    federal service under [[title10-usc|Title 10]]: federal money and missions,
    state command. Because troops in that status are not federal forces, the
    [[posse-comitatus-1878]] does not apply to them, which is why the choice of
    status under the [[reserve-mobilization|mobilization authorities]] is often
    the decisive legal question in domestic deployments. Its roots are in the
    [[dick-act-1903]].
  tags: [Title 32, National Guard, federalism, domestic deployment, U.S. Code]
