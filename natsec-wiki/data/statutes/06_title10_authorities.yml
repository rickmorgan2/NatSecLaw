- id: ucmj-1950
  title: Uniform Code of Military Justice
  short: UCMJ
  year: 1950
  enacted: "1950-05-05"
  domain: defense-arms
  public_law: "81-506"
  stat: "64 Stat. 107"
  usc: "10 U.S.C. 801-946a"
  usc_path: "10/801"
  status: in-force
  status_note: >-
    In force. Heavily revised by the Military Justice Act of 2016 (FY2017 defense
    authorization) and by the FY2022 defense authorization, which moved
    prosecution decisions for sexual assault, murder, and other covered offenses
    from commanders to independent special trial counsel, effective December 2023.
  summary: >-
    The criminal code and court system of the U.S. armed forces. It replaced the
    separate Army and Navy disciplinary codes with one law for all services,
    defining military offenses, the types of courts-martial, the rights of the
    accused, and civilian appellate review.
  provisions:
    - "Art. 2: who is subject to the code, including, since 2006, civilians accompanying forces in a contingency operation."
    - "Art. 15: nonjudicial punishment by commanders for minor offenses."
    - "Arts. 16-20: summary, special, and general courts-martial."
    - "Arts. 77-134: the punitive articles, including Art. 92 on failure to obey a lawful order and Art. 134, the general article."
    - "Arts. 141-146: the Court of Appeals for the Armed Forces, a civilian court."
  significance: >-
    It is the enforcement mechanism behind civilian control and the law of war
    inside the force: the duty to obey applies to lawful orders only. The Supreme
    Court measured the first Guantanamo commissions against it in Hamdan v.
    Rumsfeld, which led to the [[mil-commissions-2006]]. Nearly all changes to it
    now arrive through [[ndaa-annual|the annual NDAA]].
  tags: [military justice, courts-martial, lawful orders, civil-military relations, Title 10]

- id: dod-reorg-1958
  title: Department of Defense Reorganization Act of 1958
  short: DoD Reorganization Act (1958)
  year: 1958
  enacted: "1958-08-06"
  domain: defense-arms
  public_law: "85-599"
  stat: "72 Stat. 514"
  usc: "10 U.S.C. 113, 162, 164"
  usc_path: "10/162"
  status: in-force
  status_note: >-
    In force as carried forward and strengthened by the 1986 reorganization. The
    core command provisions today are 10 U.S.C. 113 (Secretary of Defense), 162
    (chain of command and assignment of forces), and 164 (combatant commanders).
  summary: >-
    President Eisenhower's reorganization. It took the military departments out
    of the operational chain of command, so that orders run from the President and
    the Secretary of Defense to unified commands, and it confirmed the Secretary's
    authority, direction, and control over the whole department.
  provisions:
    - "Operational command runs from the President to the Secretary of Defense to unified and specified commands."
    - "The military departments are limited to organizing, training, and equipping forces."
    - "Strengthened the Secretary's power to reorganize and to assign functions, and created a director of defense research and engineering."
    - "Current law: 10 U.S.C. 113(b) gives the Secretary authority, direction, and control; Sec. 162 assigns forces to combatant commands; Sec. 164 defines combatant command authority."
  significance: >-
    It is the missing step between the [[nsa-1947]] and the
    [[goldwater-nichols-1986]]. The 1986 act was needed largely because the
    services kept, in practice, much of the influence this act removed on paper.
    Sections 113, 162, and 164 are the 'Title 10 chain of command' referred to in
    debates about who may direct military operations.
  tags: [Department of Defense, organization, chain of command, combatant commands, Title 10]

- id: reserve-mobilization
  title: Reserve and National Guard Mobilization Authorities
  short: Reserve & Guard Mobilization
  year: 1952
  domain: war-powers
  public_law: "82-476"
  stat: "66 Stat. 481"
  usc: "10 U.S.C. 12301-12304b, 12406"
  usc_path: "10/12301"
  status: in-force
  status_note: >-
    In force. On December 23, 2025 the Supreme Court, in Trump v. Illinois, left in
    place an order blocking a National Guard federalization under Section
    12406(3), reasoning that 'regular forces' in that section likely means the
    regular military. The administration then ended its deployments under that
    section. The ruling came on an emergency application and litigation may
    continue. Check current status.
  summary: >-
    The set of Title 10 provisions, descended from the Armed Forces Reserve Act of
    1952 and earlier militia acts, that let the federal government order reserve
    forces and the National Guard to active duty. Each tier has its own trigger,
    size limit, and duration.
  provisions:
    - "Sec. 12301(a): full mobilization in a war or national emergency declared by Congress, for the duration plus six months."
    - "Sec. 12302: partial mobilization of up to 1,000,000 reservists for up to 24 months under a national emergency declared by the President."
    - "Sec. 12304: presidential call-up of up to 200,000 reservists for up to 365 days without a declared emergency."
    - "Secs. 12304a and 12304b: call-ups for disaster response and for preplanned missions supporting combatant commands."
    - "Sec. 12406: the President may call the National Guard into federal service in case of invasion, rebellion, or inability to execute the laws with the regular forces."
    - "By contrast, Guard members serving under Title 32 remain under state command while federally funded."
  significance: >-
    Which authority is used decides who commands the troops and what they may do:
    Guard members federalized under Title 10 fall under the
    [[posse-comitatus-1878]], while those in state or Title 32 status do not.
    Section 12406 is an alternative route to the [[insurrection-1807]], and
    Section 12302 depends on an emergency declared under the [[nea-1976]].
  tags: [National Guard, reserves, mobilization, domestic deployment, Title 10, Title 32]
  sources:
    - label: "Just Security, 'Trump v. Illinois: A Narrow Supreme Court Decision with Broad Implications'"
      url: "https://www.justsecurity.org/128371/trump-v-illinois-supreme-court/"
    - label: "Civil Rights Litigation Clearinghouse, State of Illinois v. Trump"
      url: "https://clearinghouse.net/case/47035/"

- id: sec127e-2004
  title: Support of Special Operations to Combat Terrorism (10 U.S.C. 127e)
  short: Section 127e
  year: 2004
  enacted: "2004-10-28"
  domain: war-powers
  public_law: "108-375"
  stat: "118 Stat. 1811"
  usc: "10 U.S.C. 127e"
  usc_path: "10/127e"
  status: in-force
  status_note: >-
    In force. It began as the temporary Section 1208 of the FY2005 defense
    authorization and was made permanent in Title 10 by the FY2017 act.
  summary: >-
    Lets the Secretary of Defense fund foreign forces, irregular forces, groups,
    or individuals who support or facilitate ongoing U.S. special operations
    against terrorism. These are surrogate forces working to U.S. objectives, as
    distinct from partner forces being built up for their own missions.
  provisions:
    - "Annual spending cap, set at 100 million dollars."
    - "Requires the concurrence of the relevant chief of mission."
    - "Advance notice to the congressional defense committees before a program starts or changes."
    - "States that it does not itself authorize covert action or the use of force."
  significance: >-
    It is a prime example of a Title 10 authority that resembles intelligence
    work but is overseen by the armed services committees. Programs under it
    support operations generally conducted under the [[aumf-2001]], are run by the
    command created by the [[nunn-cohen-1986]], and differ in purpose from
    capacity building under [[seccoop-2016|Chapter 16 of Title 10]].
  tags: [special operations, counterterrorism, surrogate forces, congressional oversight, Title 10]

- id: sec394-cyber-2018
  title: Military Cyber Operations Authority (10 U.S.C. 394-395)
  short: Section 394 (cyber)
  year: 2018
  enacted: "2018-08-13"
  domain: war-powers
  public_law: "115-232"
  stat: "132 Stat. 1636"
  usc: "10 U.S.C. 394-395"
  usc_path: "10/394"
  status: in-force
  status_note: In force as enacted by Section 1632 of the FY2019 defense authorization and amended since.
  summary: >-
    Affirms the Defense Department's authority to conduct military operations in
    cyberspace, including clandestine ones and ones short of hostilities, and
    classifies clandestine military cyber activity as traditional military
    activity instead of covert action.
  provisions:
    - "Sec. 394(a)-(b): authority to conduct military cyber activities to defend the United States and its allies, including outside areas of active hostilities."
    - "Sec. 394(c): a clandestine military cyber operation is a traditional military activity for purposes of the covert action statute."
    - "Sec. 395: written notice to the armed services committees within 48 hours of a sensitive military cyber operation."
    - "Related provisions require quarterly cyber operations briefings."
  significance: >-
    It settled, in the military's favor, a long interagency argument about
    whether offensive cyber operations needed a presidential finding. That makes
    it the clearest statutory marker on the line drawn by the
    [[intel-oversight-1980]], and its 'short of hostilities' language speaks
    directly to the [[wpr-1973]]. It was enacted in
    [[ndaa-annual|the FY2019 NDAA]].
  tags: [cyber operations, traditional military activities, covert action, congressional oversight, Title 10]

- id: sec284-counterdrug-1990
  title: Defense Support for Counterdrug Activities (10 U.S.C. 284)
  short: Section 284 (counterdrug)
  year: 1990
  enacted: "1990-11-05"
  domain: war-powers
  public_law: "101-510"
  stat: "104 Stat. 1485"
  usc: "10 U.S.C. 284; 10 U.S.C. 124"
  usc_path: "10/284"
  status: in-force
  status_note: >-
    In force. It began as Section 1004 of the FY1991 defense authorization and
    was made permanent in Title 10 by the FY2017 act.
  summary: >-
    Authorizes the Defense Department to support the counterdrug and counter
    transnational organized crime work of other federal agencies and of state,
    local, and foreign law enforcement, when they ask for it.
  provisions:
    - "Support includes transport, equipment maintenance, training, intelligence analysis, and aerial and ground reconnaissance."
    - "Sec. 284(b)(7): construction of roads, fences, and lighting to block drug smuggling corridors across U.S. borders."
    - "Support to foreign agencies requires consultation with the Secretary of State."
    - "10 U.S.C. 124 separately makes the department the lead federal agency for detecting and monitoring drug traffic by air and sea."
  significance: >-
    It is a support authority: it works within the limits of the
    [[posse-comitatus-1878]] and does not authorize the use of force. In 2019 it
    was used, together with [[sec2808-milcon-1982|Section 2808]], to redirect
    defense funds to border barriers. Overseas, it overlaps with
    [[seccoop-2016|Chapter 16 of Title 10]].
  tags: [counterdrug, law enforcement support, border, transnational crime, Title 10]

- id: sec2808-milcon-1982
  title: Emergency Military Construction Authority (10 U.S.C. 2808)
  short: Section 2808 (construction)
  year: 1982
  enacted: "1982-07-12"
  domain: war-powers
  public_law: "97-214"
  stat: "96 Stat. 153"
  usc: "10 U.S.C. 2808"
  usc_path: "10/2808"
  status: in-force
  status_note: >-
    In force. The FY2021 defense authorization capped its use at 500 million
    dollars per emergency, and 100 million for projects inside the United States.
  summary: >-
    One of the standby powers unlocked by a national emergency. When a declared
    war or emergency requires use of the armed forces, the Secretary of Defense
    may build military construction projects that Congress never authorized, using
    unspent military construction funds.
  provisions:
    - "Trigger: a declaration of war, or a national emergency declared by the President that requires use of the armed forces."
    - "Projects must be necessary to support that use of the armed forces."
    - "Funding comes from military construction money already appropriated and not yet obligated."
    - "Congress must be notified of each decision and its cost."
  significance: >-
    Used quietly for overseas projects after 2001, it became prominent in 2019
    when 3.6 billion dollars was moved from other projects to border barriers. It
    is the standard worked example of how the [[nea-1976]] converts a
    proclamation into spending power, and the later cap came through
    [[ndaa-annual|the annual NDAA]].
  tags: [emergency powers, military construction, appropriations, border, Title 10]
