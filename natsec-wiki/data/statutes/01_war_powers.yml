- id: wpr-1973
  title: War Powers Resolution
  short: War Powers Resolution
  year: 1973
  enacted: "1973-11-07"
  domain: war-powers
  public_law: "93-148"
  stat: "87 Stat. 555"
  usc: "50 U.S.C. 1541-1550"
  usc_path: "50/1541"
  status: in-force
  status_note: >-
    In force. Every administration since Nixon has questioned the constitutionality
    of parts of it, and the 60-day clock has rarely been treated as binding. In
    2026 House members introduced resolutions under it concerning U.S. military
    action in Venezuela and against Iran; their outcomes are not recorded here.
    Check current status.
  summary: >-
    Passed over President Nixon's veto, the War Powers Resolution is Congress's
    framework statute for sharing the decision to commit U.S. forces to hostilities.
    It requires consultation before forces are introduced, a report to Congress
    within 48 hours, and withdrawal within 60 days (plus a 30-day drawdown) unless
    Congress declares war or passes a specific authorization.
  provisions:
    - "Sec. 2(c): states that the President may introduce forces into hostilities only under a declaration of war, specific statutory authorization, or a national emergency created by an attack on the United States."
    - "Sec. 3: consultation with Congress 'in every possible instance' before introducing forces."
    - "Sec. 4(a)(1): written report within 48 hours of introducing forces into hostilities or imminent hostilities."
    - "Sec. 5(b): the 60-day termination clock, extendable by 30 days for safe withdrawal."
    - "Sec. 5(c): withdrawal by concurrent resolution, widely viewed as unenforceable after INS v. Chadha (1983); expedited joint-resolution procedures were added in 1983."
    - "Sec. 8: authority to use force may not be inferred from appropriations acts or treaties."
  significance: >-
    It is the reference point for every later use-of-force debate. Each
    authorization for use of military force, including the [[aumf-2001]], declares
    itself to be the 'specific statutory authorization' that Sec. 5(b) requires.
    Disputes usually turn on what counts as 'hostilities' and on whether a report
    was filed under Sec. 4(a)(1), which is what starts the clock.
  tags: [war powers, congressional oversight, hostilities, reporting]
  sources:
    - label: "CO-06 House office, War Powers Resolution on Venezuela (Jan. 8, 2026)"
      url: "https://crow.house.gov/media/press-releases/crow-introduces-war-powers-resolution-to-rein-in-trump-military-action-in-venezuela"
    - label: "CO-06 House office, press releases (Iran resolutions, May to July 2026)"
      url: "https://crow.house.gov/media/press-releases"

- id: aumf-2001
  title: Authorization for Use of Military Force (2001)
  short: 2001 AUMF
  year: 2001
  enacted: "2001-09-18"
  domain: war-powers
  public_law: "107-40"
  stat: "115 Stat. 224"
  usc: "50 U.S.C. 1541 note"
  status: in-force
  status_note: >-
    In force with no sunset. It survived the December 2025 repeal of the two Iraq
    authorizations and remains the main statutory basis for counterterrorism
    operations.
  summary: >-
    Enacted a week after the September 11 attacks, this joint resolution authorizes
    the President to use all necessary and appropriate force against the nations,
    organizations, or persons that planned, authorized, committed, or aided the
    attacks, or that harbored those who did.
  provisions:
    - "Sec. 2(a): the operative grant of authority, tied to responsibility for the September 11 attacks."
    - "Sec. 2(b): declares the resolution to be specific statutory authorization under the War Powers Resolution."
    - "Contains no geographic limit, no named enemy, and no expiration date."
  significance: >-
    Successive administrations have read it to cover al-Qaeda, the Taliban, and
    'associated forces', and later the Islamic State, in countries far from
    Afghanistan. It also underpins wartime detention at Guantanamo, which links it
    to the [[dta-2005]] and the [[mil-commissions-2006]]. Proposals to repeal or replace it
    recur in most Congresses.
  tags: [use of force, counterterrorism, detention, associated forces]

- id: aumf-iraq-2002
  title: Authorization for Use of Military Force Against Iraq Resolution of 2002
  short: 2002 Iraq AUMF
  year: 2002
  enacted: "2002-10-16"
  domain: war-powers
  public_law: "107-243"
  stat: "116 Stat. 1498"
  usc: "50 U.S.C. 1541 note"
  status: repealed
  status_note: >-
    Repealed by the National Defense Authorization Act for Fiscal Year 2026
    (Pub. L. 119-60), signed December 18, 2025. It was the first repeal of a war
    authorization since the Gulf of Tonkin Resolution was repealed in 1971.
  summary: >-
    Authorized the President to use the armed forces to defend U.S. national
    security against the continuing threat posed by Iraq and to enforce relevant
    U.N. Security Council resolutions. It was the domestic legal basis for the 2003
    invasion.
  provisions:
    - "Sec. 3(a): authority to use force against the threat posed by Iraq and to enforce Security Council resolutions."
    - "Sec. 3(b): presidential determination that diplomacy alone would not protect the United States."
    - "Sec. 3(c): declared itself specific statutory authorization under the War Powers Resolution."
  significance: >-
    Long after the Saddam Hussein government fell, the executive branch cited it as
    supplementary authority, including for the January 2020 strike on Qassem
    Soleimani. That use drove the repeal effort that finally succeeded through
    [[ndaa-annual|the annual NDAA]].
  tags: [use of force, Iraq, repeal]
  sources:
    - label: "Roll Call, 'Congress inches toward reclaiming war powers with AUMF repeals' (Dec. 24, 2025)"
      url: "https://rollcall.com/2025/12/24/congress-inches-toward-reclaiming-war-powers-with-aumf-repeals/"
    - label: "Sen. Kaine press release on enactment of the repeal"
      url: "https://www.kaine.senate.gov/press-releases/kaine-and-young-applaud-bipartisan-bill-to-formally-end-iraq-wars-becoming-law"

- id: aumf-gulf-1991
  title: Authorization for Use of Military Force Against Iraq Resolution (1991)
  short: 1991 Gulf War AUMF
  year: 1991
  enacted: "1991-01-14"
  domain: war-powers
  public_law: "102-1"
  stat: "105 Stat. 3"
  usc: "50 U.S.C. 1541 note"
  status: repealed
  status_note: >-
    Repealed together with the 2002 Iraq authorization by the National Defense
    Authorization Act for Fiscal Year 2026 (Pub. L. 119-60), signed December 18,
    2025.
  summary: >-
    Authorized the President to use force under U.N. Security Council Resolution
    678 to expel Iraqi forces from Kuwait, after a presidential determination that
    diplomatic means had been exhausted.
  provisions:
    - "Sec. 2(a): authority to use force pursuant to Security Council Resolution 678."
    - "Sec. 2(b): required a presidential determination to Congress before force was used."
    - "Sec. 2(c): declared itself specific statutory authorization under the War Powers Resolution."
  significance: >-
    It is the clearest modern case of Congress authorizing force to carry out a
    Security Council mandate, which ties it to the [[unpa-1945]]. The close Senate vote
    (52 to 47) is often cited as the last seriously contested war vote before 2002.
  tags: [use of force, Iraq, Kuwait, United Nations, repeal]
  sources:
    - label: "Roll Call, 'Congress inches toward reclaiming war powers with AUMF repeals' (Dec. 24, 2025)"
      url: "https://rollcall.com/2025/12/24/congress-inches-toward-reclaiming-war-powers-with-aumf-repeals/"

- id: tonkin-1964
  title: Gulf of Tonkin Resolution
  short: Gulf of Tonkin Resolution
  year: 1964
  enacted: "1964-08-10"
  domain: war-powers
  public_law: "88-408"
  stat: "78 Stat. 384"
  status: repealed
  status_note: >-
    Repealed in January 1971 by section 12 of Pub. L. 91-672, an amendment to the
    Foreign Military Sales Act.
  summary: >-
    A joint resolution approving 'all necessary measures' by the President to repel
    attacks on U.S. forces and prevent further aggression in Southeast Asia. It
    became the legal foundation for the escalation of the Vietnam War.
  provisions:
    - "Approved and supported the President's determination to take all necessary measures to repel armed attack and prevent further aggression."
    - "Authorized force to assist any member or protocol state of the Southeast Asia Collective Defense Treaty that requested help."
    - "Would expire when the President determined peace was secured, or earlier by concurrent resolution of Congress."
  significance: >-
    Its open-ended wording, and later doubts about the incident that prompted it,
    shaped the congressional backlash that produced the [[wpr-1973]] and the wider
    reassertion statutes of the 1970s.
  tags: [use of force, Vietnam, repeal, open-ended authorization]

- id: nea-1976
  title: National Emergencies Act
  short: National Emergencies Act
  year: 1976
  enacted: "1976-09-14"
  domain: war-powers
  public_law: "94-412"
  stat: "90 Stat. 1255"
  usc: "50 U.S.C. 1601-1651"
  usc_path: "50/1601"
  status: in-force
  status_note: >-
    In force. Dozens of declared emergencies remain active, most of them sanctions
    programs that are renewed every year.
  summary: >-
    Ended the open-ended emergencies that had accumulated since the 1930s and set
    procedures for declaring, renewing, and terminating national emergencies. A
    declaration unlocks more than a hundred standby statutory powers, but the
    President must specify which ones are being used.
  provisions:
    - "Title I: terminated powers exercised under emergencies in effect in 1976."
    - "Sec. 201: the President declares an emergency by proclamation published in the Federal Register."
    - "Sec. 202: emergencies lapse after one year unless renewed; Congress may terminate by joint resolution (changed from concurrent resolution in 1985) and is directed to consider termination every six months."
    - "Sec. 301: the President must name the statutory authorities being invoked."
    - "Title IV: accounting and reporting requirements."
  significance: >-
    It is the procedural gateway for [[ieepa-1977]], so nearly every U.S. economic
    sanctions program rests on a declaration made under it. Because termination now
    requires a joint resolution that the President can veto, critics argue the
    check Congress intended in 1976 is much weaker in practice.
  tags: [emergency powers, congressional oversight, sanctions]

- id: insurrection-1807
  title: Insurrection Act
  short: Insurrection Act
  year: 1807
  domain: war-powers
  stat: "2 Stat. 443"
  usc: "10 U.S.C. 251-255"
  usc_path: "10/251"
  status: in-force
  status_note: >-
    In force. The sections were renumbered from 10 U.S.C. 331-335 in 2016.
  summary: >-
    A set of provisions, first enacted in 1807 and broadened in 1861 and 1871,
    that lets the President use the armed forces and federalized militia inside
    the United States to suppress insurrection, enforce federal law, or protect
    civil rights when ordinary enforcement fails.
  provisions:
    - "10 U.S.C. 251: deployment at the request of a state legislature or governor."
    - "10 U.S.C. 252: deployment to enforce federal law when unlawful obstruction or rebellion makes ordinary enforcement impracticable."
    - "10 U.S.C. 253: deployment to protect constitutional rights that a state cannot or will not protect."
    - "10 U.S.C. 254: requires a proclamation ordering insurgents to disperse before forces are used."
  significance: >-
    It is the main statutory exception to the [[posse-comitatus-1878]]. A 2006
    expansion made through that year's defense authorization was repealed in 2008,
    and reform proposals since 2020 have focused on defining its triggers and
    adding time limits and judicial review.
  tags: [domestic deployment, civil-military relations, emergency powers]

- id: posse-comitatus-1878
  title: Posse Comitatus Act
  short: Posse Comitatus Act
  year: 1878
  enacted: "1878-06-18"
  domain: war-powers
  stat: "20 Stat. 152"
  usc: "18 U.S.C. 1385"
  usc_path: "18/1385"
  usc_titles: [10]
  status: in-force
  status_note: >-
    In force. Extended by name to the Navy, Marine Corps, and Space Force by the
    FY2022 National Defense Authorization Act.
  summary: >-
    A one-sentence criminal statute that bars using federal military forces to
    execute the laws unless the Constitution or an act of Congress expressly
    authorizes it.
  provisions:
    - "Makes it a crime to willfully use covered armed forces as a posse comitatus or otherwise to execute the laws."
    - "Does not apply to the National Guard in state status, or to the Coast Guard."
    - "Operates alongside 10 U.S.C. 271-284, which allow military support to civilian law enforcement short of direct participation in searches, seizures, and arrests."
  significance: >-
    It expresses the norm that soldiers do not police civilians. Its practical
    reach is set by its exceptions, above all the [[insurrection-1807]].
  tags: [domestic deployment, civil-military relations, law enforcement]

- id: case-zablocki-1972
  title: Case-Zablocki Act
  short: Case-Zablocki Act
  year: 1972
  enacted: "1972-08-22"
  domain: war-powers
  public_law: "92-403"
  stat: "86 Stat. 619"
  usc: "1 U.S.C. 112b"
  usc_path: "1/112b"
  status: in-force
  status_note: >-
    In force, substantially rewritten by section 5947 of the FY2023 National
    Defense Authorization Act (Pub. L. 117-263).
  summary: >-
    Requires the Secretary of State to send Congress the text of international
    agreements other than treaties. It was a response to secret executive
    agreements, including basing and security commitments, discovered in the late
    1960s.
  provisions:
    - "Transmission of executive agreements to Congress, originally within 60 days of entry into force."
    - "Classified agreements go to the foreign relations committees under an injunction of secrecy."
    - "2022 amendments: monthly reporting, public posting of texts, a statement of the legal authority for each agreement, and coverage of certain non-binding instruments."
  significance: >-
    It is the main transparency check on executive agreements, which far outnumber
    treaties. It belongs with the [[wpr-1973]] and the [[nea-1976]] as part of the 1970s
    effort to restore congressional visibility into foreign commitments.
  tags: [executive agreements, treaties, transparency, congressional oversight]

- id: unpa-1945
  title: United Nations Participation Act of 1945
  short: UN Participation Act
  year: 1945
  enacted: "1945-12-20"
  domain: war-powers
  public_law: "79-264"
  stat: "59 Stat. 619"
  usc: "22 U.S.C. 287-287e"
  usc_path: "22/287"
  status: in-force
  status_note: In force.
  summary: >-
    Governs U.S. participation in the United Nations: how representatives are
    appointed, how the United States carries out Security Council decisions, and
    the terms on which U.S. forces may be made available to the Council.
  provisions:
    - "Sec. 5 (22 U.S.C. 287c): the President may implement Security Council measures not involving armed force, such as sanctions, with criminal penalties for violations."
    - "Sec. 6: agreements to place forces at the Council's disposal under Article 43 of the Charter require congressional approval. No such agreement has ever been concluded."
    - "Sec. 7 (added 1949): allows detail of up to 1,000 personnel to U.N. activities in noncombatant roles."
  significance: >-
    It sits at the center of the question whether a Security Council resolution can
    substitute for congressional authorization, argued over Korea in 1950 and Libya
    in 2011. Section 5 is also a sanctions authority that operates next to
    [[ieepa-1977]].
  tags: [United Nations, Security Council, sanctions, use of force]

- id: dta-2005
  title: Detainee Treatment Act of 2005
  short: Detainee Treatment Act
  year: 2005
  enacted: "2005-12-30"
  domain: war-powers
  public_law: "109-148"
  stat: "119 Stat. 2739"
  usc: "42 U.S.C. 2000dd"
  usc_path: "42/2000dd"
  usc_titles: [10]
  status: in-force
  status_note: >-
    In force as amended. Its limits on habeas review were narrowed by the Supreme
    Court in Hamdan v. Rumsfeld (2006) and Boumediene v. Bush (2008).
  summary: >-
    Known as the McCain Amendment, it prohibits cruel, inhuman, or degrading
    treatment of anyone in U.S. custody, wherever held, and ties Defense Department
    interrogations to the Army Field Manual. It was enacted as Title X of the
    FY2006 defense appropriations act and again in that year's defense
    authorization.
  provisions:
    - "Sec. 1002: Defense Department interrogations limited to techniques listed in the Army Field Manual."
    - "Sec. 1003: ban on cruel, inhuman, or degrading treatment regardless of nationality or location."
    - "Sec. 1004: legal defense for personnel who relied in good faith on legal advice."
    - "Sec. 1005: limited federal court review of Guantanamo detention and military commission decisions."
  significance: >-
    It was the first statutory limit on post-2001 interrogation practice. Its
    jurisdiction-stripping language set up the litigation that led to
    the [[mil-commissions-2006]]. The Field Manual rule was extended to all agencies in
    the FY2016 defense authorization.
  tags: [detention, interrogation, torture, habeas corpus, Guantanamo]

- id: mil-commissions-2006
  title: Military Commissions Act of 2006
  short: Military Commissions Act
  year: 2006
  enacted: "2006-10-17"
  domain: war-powers
  public_law: "109-366"
  stat: "120 Stat. 2600"
  usc: "10 U.S.C. 948a-950t"
  usc_path: "10/948a"
  status: in-force
  status_note: >-
    In force as replaced by the Military Commissions Act of 2009 (Title XVIII of
    the FY2010 National Defense Authorization Act, Pub. L. 111-84).
  summary: >-
    Passed after Hamdan v. Rumsfeld struck down the commissions created by
    presidential order, it gave statutory authority to try alien unlawful enemy
    combatants by military commission and defined the offenses and procedures.
  provisions:
    - "Added chapter 47A to Title 10: jurisdiction, procedures, and triable offenses for military commissions."
    - "Sec. 7: removed habeas jurisdiction over detained alien enemy combatants, held unconstitutional in Boumediene v. Bush (2008)."
    - "Amended the War Crimes Act to narrow which Common Article 3 violations are federal crimes."
    - "2009 revision: tighter rules on coerced statements and hearsay, and better access to counsel and evidence."
  significance: >-
    It is the statutory basis for the Guantanamo commissions, whose jurisdiction
    depends on the armed conflict authorized by the [[aumf-2001]]. It also amended the
    habeas provisions of the [[dta-2005]].
  tags: [detention, military commissions, habeas corpus, Guantanamo, law of war]
