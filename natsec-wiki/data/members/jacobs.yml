background: >-
  Before Congress she worked on conflict prevention at the UN Department of
  Peacekeeping Operations, the UNICEF Innovation Unit, and the State Department's
  Bureau of Conflict and Stabilization Operations, and advised Hillary Clinton's
  2016 campaign on foreign policy. She represents much of the city of San Diego
  together with El Cajon, La Mesa, and Lemon Grove. Serving her third term in the
  119th Congress, she was reelected on November 3, 2026, on the AP's call. She sits
  on the House Armed Services and Foreign Affairs Committees, is Ranking Member of
  the Foreign Affairs Subcommittee on Africa, and co-founded and co-chairs the
  Protection of Civilians in Conflict Caucus. Committee assignments for the 120th
  Congress had not been announced when this page was last reviewed.
