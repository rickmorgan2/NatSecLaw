    short: Iran school strike inquiry
    date: "2026-04-07"
    kind: Oversight letter
    summary: >-
      With Reps. Sara Jacobs and Yassamin Ansari, led a group of House members
      seeking information on a reported U.S. strike on the Shajareh Tayyebeh girls'
      school in Iran, the targeting decisions behind it, and the steps taken to
