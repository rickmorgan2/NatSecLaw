  - id: civharm-ig-letter-2026
    title: Letter on the dismantling of civilian harm programs
    short: CHMR compliance letter
    date: "2026-07-09"
    kind: Oversight letter
    summary: >-
      With Sen. Elizabeth Warren, Rep. Sara Jacobs, and seven other senators, asked
      Secretary Hegseth to explain why civilian protection policies had not been
      implemented, account for staffing and resource cuts, and explain how the
      Department was complying with the statutes that require those policies and
      institutions. The letter followed an Inspector General finding that the
      action plan's objectives were at risk.
    statutes: [civcas-policy-2018, cp-coe-2022, ex-gratia-2019]
    source:
      label: "Rep. Jason Crow's office, press release (July 9, 2026)"
