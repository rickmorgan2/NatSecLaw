slug: crow
name: Rep. Jason Crow
short: Crow (CO-06)
district: CO-06
seat: Colorado's 6th Congressional District
party: Democrat
as_of: "2026-11-10"
background: >-
  Former Army Ranger and paratrooper with three combat tours in Iraq and
  Afghanistan. First elected in 2018 and reelected to a fifth term on November 3,
  2026. In the 119th Congress he serves on the House Armed Services Committee and
  the House Permanent Select Committee on Intelligence, and he co-founded and
  co-chairs the Protection of Civilians in Conflict Caucus. Committee assignments
  for the 120th Congress had not been announced when this page was last reviewed.
