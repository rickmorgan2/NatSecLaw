# Publish the prebuilt natsec wiki (natsec-wiki/docs) to GitHub Pages.
# No R or Quarto runs here: render locally with `Rscript R/deploy.R render`, commit docs/, push.
# docs/v1 holds the archived first version, copied in by R/post_render.R.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ["natsec-wiki/docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: natsec-wiki/docs
      - id: deployment
        uses: actions/deploy-pages@v4
